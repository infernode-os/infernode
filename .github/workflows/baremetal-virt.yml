name: Bare-metal kernel (QEMU virt)

# The native kernel -- os/arm64, os/port, os/ip and the libraries, with
# no host OS under them -- built for QEMU's `virt` machine and booted
# there: to a shell, through DHCP, off a FAT card, and on to the Lucifer
# desktop. It is the half of tests/host/baremetal_test.sh that needs no
# Raspberry Pi and no Raspberry Pi model, which is what makes it
# something a CI runner can do. os/virt/README.md says what the port is
# for and, as important, what it is not evidence of.
#
# NOT run here: the bcm2837 half (QEMU's raspi3b). It is three times as
# long and several of its checks are about timing -- USB hot-plug, a
# boot watchdog, a preemption budget -- on a machine model that is slow
# under emulation. It has only ever been run on a developer's machine,
# and how it behaves on a shared runner is not known. Until it is,
# putting it in front of every pull request would teach people to
# ignore a red mark. Run it by hand:
#
#     BAREMETAL_PLATFORMS=bcm2837 ./tests/host/baremetal_test.sh
#
# THE HARNESS SKIPS, AND EXITS ZERO, when clang, ld.lld or QEMU is
# missing. That is right on a laptop and would be a lie here: a green
# mark that built nothing. So this job does not trust the exit status
# alone -- see "Assert that the checks ran".

on:
  pull_request:
    paths:
      - 'os/**'
      - 'libinterp/**'
      - 'libkern/**'
      - 'libkernfp/**'
      - 'libsec/**'
      - 'libmp/**'
      - 'libkeyring/**'
      - 'libmath/**'
      - 'libtk/**'
      - 'libdraw/**'
      - 'libmemdraw/**'
      - 'libmemlayer/**'
      - 'include/**'
      - 'Inferno/arm64/**'
      - 'module/runt.m'
      - 'module/bench.m'
      - 'lib/lucifer/boot-baremetal.sh'
      - 'tests/host/baremetal_test.sh'
      - 'tools/mkrootfs.py'
      - 'tools/mkcard.py'
      - '.github/workflows/baremetal-virt.yml'
  push:
    branches: [ master, feat/baremetal-pi ]
    paths:
      - 'os/**'
      - 'libinterp/**'
      - 'tests/host/baremetal_test.sh'
      - '.github/workflows/baremetal-virt.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  virt:
    name: Build, boot and test on QEMU virt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # clang targets every architecture it was built for, so the distro's
    # is a cross compiler already; lld and llvm supply ld.lld,
    # llvm-objcopy, llvm-ar and llvm-nm under the names the harness looks
    # for. qemu-system-arm is the package that carries
    # qemu-system-aarch64. dosfstools is for fsck.fat, which checks the
    # card image tools/mkcard.py writes.
    - name: Install the cross toolchain and QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang lld llvm qemu-system-arm dosfstools python3

    - name: The tools the harness would otherwise skip for
      run: |
        set -e
        for t in clang ld.lld llvm-objcopy llvm-ar llvm-nm qemu-system-aarch64 python3; do
          command -v "$t" >/dev/null || { echo "::error::$t is not on PATH"; exit 1; }
        done
        clang --version | head -1
        qemu-system-aarch64 --version | head -1
        clang --print-targets | grep -q aarch64 || { echo "::error::this clang has no aarch64 target"; exit 1; }
        qemu-system-aarch64 -machine help | grep -q '^virt ' || { echo "::error::this QEMU has no virt machine"; exit 1; }

    # The kernel build runs the native limbo: runt.h and the other C views
    # of the Dis module interfaces are generated from module/runt.m, and
    # the Limbo that goes into the image is compiled by it.
    - name: Build mk and limbo
      run: |
        set -e
        SYSTARG=Linux OBJTYPE=amd64 ./makemk.sh
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        for d in lib9 libbio libmp libsec libmath utils/iyacc limbo; do
          (cd "$d" && mk install)
        done
        test -x Linux/amd64/bin/limbo

    # dis/ is a build product. The kernel's recovery root takes some
    # fifty modules from it, and the desktop check copies all of it onto
    # a card. (tests/ is not built: nothing here runs it.)
    - name: Build the Dis tree
      run: |
        set -e
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        for d in appl appl/mpeg appl/veltro; do
          (cd "$d" && mk install) > "/tmp/dis-$(basename "$d").log" 2>&1 || {
            grep -E '\.b:[0-9]+:' "/tmp/dis-$(basename "$d").log" | grep -v 'warning:' | head -40
            echo "::error::mk install failed in $d"; exit 1; }
        done
        test -f dis/sh.dis && test -f dis/lucifer.dis

    - name: Build the kernel, boot it, and run the virt checks
      run: |
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        mkdir -p "$RUNNER_TEMP/bm"
        set +e
        BAREMETAL_PLATFORMS=virt BAREMETAL_BUILD_DIR="$RUNNER_TEMP/bm" \
          ./tests/host/baremetal_test.sh 2>&1 | tee "$RUNNER_TEMP/bm/harness.log"
        echo "HARNESS_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        exit 0

    # The exit status says nothing failed. It does not say anything RAN:
    # see the top of this file. So read the summary line, and require
    # the last and most demanding check by name -- the desktop, drawn,
    # from a card -- because a run that reached it ran everything
    # before it.
    - name: Assert that the checks ran
      run: |
        set -e
        log="$RUNNER_TEMP/bm/harness.log"
        tail -1 "$log"
        sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
        summary="$(grep -E '^Passed: [0-9]+ +Failed: [0-9]+ +Skipped: [0-9]+' "$log.plain" | tail -1)"
        [ -n "$summary" ] || { echo "::error::the harness printed no summary"; exit 1; }
        passed=$(echo "$summary" | sed -E 's/^Passed: ([0-9]+).*/\1/')
        failed=$(echo "$summary" | sed -E 's/.*Failed: ([0-9]+).*/\1/')
        skipped=$(echo "$summary" | sed -E 's/.*Skipped: ([0-9]+).*/\1/')
        grep -E '^(FAIL|SKIP)' "$log.plain" || true
        [ "$HARNESS_STATUS" = "0" ] || { echo "::error::the harness exited $HARNESS_STATUS"; exit 1; }
        [ "$failed" = "0" ]   || { echo "::error::$failed checks failed"; exit 1; }
        [ "$skipped" = "0" ]  || { echo "::error::$skipped checks were skipped; on this runner nothing should be"; exit 1; }
        [ "$passed" -ge 45 ]  || { echo "::error::only $passed checks passed; the virt half has about fifty"; exit 1; }
        grep -q '^PASS: virt: Lucifer draws the desktop on the ramfb screen' "$log.plain" \
          || { echo "::error::the run never reached the desktop check"; exit 1; }

    # What a failure needs to be understood: every boot's serial log,
    # the compiler's, and the two screens as QEMU saw them. The kernel
    # itself too -- virt-kernel.elf has the symbols a panic's addresses
    # want.
    - name: Keep the logs, the screens and the kernel
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: baremetal-virt
        retention-days: 14
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/bm/harness.log
          ${{ runner.temp }}/bm/cc.log
          ${{ runner.temp }}/bm/virt-*.txt
          ${{ runner.temp }}/bm/virt-*.ppm
          ${{ runner.temp }}/bm/mkcard.txt
          ${{ runner.temp }}/bm/fsck.txt
          ${{ runner.temp }}/bm/virt-kernel.elf
          ${{ runner.temp }}/bm/virt-kernel.img
