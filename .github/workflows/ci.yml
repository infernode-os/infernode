  # ─────────────────────────────────────────────
  # Linux RISC-V 64: cross-built, run under qemu-user
  # ─────────────────────────────────────────────
  # No hosted riscv64 runner exists, so the emulator is cross-compiled
  # (build-linux-riscv64.sh) and run under qemu-riscv64. What this says
  # is that the port builds and that the JIT (comp-riscv64.c) is right
  # instruction by instruction and on the boot path; it says nothing
  # about speed. The bare-metal RISC-V kernel is baremetal.yml's.
  linux-riscv64-cross:
    name: Linux RISC-V 64 Cross Build & JIT Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the cross compiler and qemu-user
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user

    # The host's mk and limbo drive the cross build; dis/ is portable
    # bytecode, built once by the host.
    - name: Build the host's mk and limbo, and the Dis tree
      run: |
        set -e
        SYSTARG=Linux OBJTYPE=amd64 ./makemk.sh
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        for d in lib9 libbio libmp libsec libmath utils/iyacc limbo; do
          (cd "$d" && mk install)
        done
        for d in appl appl/mpeg appl/veltro tests; do
          (cd "$d" && mk install) > "/tmp/dis-$(basename "$d").log" 2>&1 || {
            grep -E '\.b:[0-9]+:' "/tmp/dis-$(basename "$d").log" | grep -v 'warning:' | head -40
            echo "::error::mk install failed in $d"; exit 1; }
        done
        test -f dis/jittest.dis && test -f dis/tests/jit_fault_test.dis

    - name: Cross-build the riscv64 emulator
      run: |
        ./build-linux-riscv64.sh
        file emu/Linux/o.emu | grep -q 'RISC-V' || { echo "::error::o.emu is not a RISC-V binary"; exit 1; }

    - name: Wrap the emulator in qemu-user
      run: |
        cat > "$RUNNER_TEMP/emu-rv" <<EOF
        #!/bin/sh
        exec qemu-riscv64 -L /usr/riscv64-linux-gnu "$ROOT/emu/Linux/o.emu" "\$@"
        EOF
        chmod +x "$RUNNER_TEMP/emu-rv"
        # emu leaves by killing its process group; timeout gives it one
        # of its own, so the step's shell is not in it
        timeout 60 "$RUNNER_TEMP/emu-rv" -c0 -r. /dis/echo.dis riscv64 emu runs > echo.txt 2>&1 < /dev/null || true
        cat echo.txt
        grep -q "riscv64 emu runs" echo.txt

    - name: Run JIT correctness tests
      run: |
        timeout 600 "$RUNNER_TEMP/emu-rv" -c1 -r . /dis/jittest.dis > jit-test.txt 2>&1 < /dev/null || true
        cat jit-test.txt
        grep -q "^PASS$" jit-test.txt || { echo "::error::jittest failed under the riscv64 JIT"; exit 1; }

    - name: Run JIT fault tests (JIT and interpreter)
      run: |
        for t in jit_fault_test jit_ownhandler_test jit_bounds_test utf21_test; do
          for c in 1 0; do
            timeout 300 "$RUNNER_TEMP/emu-rv" -c$c -r . /dis/tests/$t.dis -v > $t-c$c.txt 2>&1 < /dev/null || true
            cat $t-c$c.txt
            grep -qx PASS $t-c$c.txt && ! grep -q -- '--- FAIL' $t-c$c.txt \
              || { echo "::error::$t failed with -c$c"; exit 1; }
          done
        done

    - name: Run JIT boot smoke test
      run: |
        chmod +x tests/host/jit_boot_test.sh
        EMU="$RUNNER_TEMP/emu-rv" TIMEOUT=600 tests/host/jit_boot_test.sh

  # ─────────────────────────────────────────────
  # macOS: Build using shipped toolchain, on Apple silicon and on Intel
  # ─────────────────────────────────────────────
  macos:
    name: macOS ${{ matrix.label }} Build & Test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: ARM64
            runner: macos-15
            backstop: 1500  # the suite runs interpreted here (no -c1)
          # Intel Macs (#786).  macos-15-intel is GitHub's last Intel
          # macOS image; the job goes when it does.
          - arch: amd64
            label: AMD64
            runner: macos-15-intel
            backstop: 1800  # an i7-8700B, interpreted: slower still
    env:
      ROOT: ${{ github.workspace }}
      OBJTYPE: ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install emulator dependencies (SDL3, opus, libfido2)
      run: |
        # The emu links SDL3 + opus even in the headless build (audio-sdl3.o /
        # devopus.o are shared with the sdl3 backend and reference them; the
        # display still uses no-op stubs).  libfido2 enables /dev/2fa.
        brew install sdl3 opus libfido2 || brew install sdl3 opus libfido2

    - name: Stamp build version
      run: |
        BUILD_DATE=$(date +%Y%m%d)
        SHORT_SHA=${GITHUB_SHA::8}
        sed -i '' "s|InferNode 0.1|InferNode 0.1 build ${BUILD_DATE}-${SHORT_SHA}|" include/version.h
        echo "Version: $(cat include/version.h)"

    - name: Build mk
      run: |
        chmod +x makemk.sh
        ./makemk.sh
        test -x MacOSX/$OBJTYPE/bin/mk || { echo "mk build failed"; exit 1; }

    - name: Build system libraries
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:/usr/bin:/bin"

        for dir in lib9 libbio libmp libsec libmath; do
          echo "Building $dir..."
          (cd $dir && "$ROOT/MacOSX/$OBJTYPE/bin/mk" install) || exit 1
        done

    - name: Build limbo compiler
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:/usr/bin:/bin"
        (cd limbo && "$ROOT/MacOSX/$OBJTYPE/bin/mk" install) || exit 1
        test -x MacOSX/$OBJTYPE/bin/limbo || { echo "limbo not found"; exit 1; }

    - name: Build libinterp and remaining libraries
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:/usr/bin:/bin"
        (cd libinterp && "$ROOT/MacOSX/$OBJTYPE/bin/mk" install) || exit 1
        for dir in libkeyring libmemdraw libmemlayer libdraw; do
          echo "Building $dir..."
          if ! (cd $dir && "$ROOT/MacOSX/$OBJTYPE/bin/mk" install); then
            echo "WARNING: $dir build failed (non-fatal for headless build)"
          fi
        done
        # libtk is REQUIRED: the emu links libtk.a (Tk reintegration), even in
        # the headless build.  Build it after libdraw, and fail hard if it does
        # not build (the emu link would fail with 'libtk.a not found').
        (cd libtk && "$ROOT/MacOSX/$OBJTYPE/bin/mk" install) || { echo "libtk build failed"; exit 1; }

    - name: Build headless emulator
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:/usr/bin:/bin"
        cd emu/MacOSX
        # GUIBACK=headless (mkfile-gui-headless) is the maintained headless
        # build — no-op display stubs, but it still links SDL3/opus/fido2 that
        # the shared device objects reference.  The old mkfile-g predates the
        # SDL3 reintegration (SYSLIBS lacked SDL) and no longer links.
        SYSTARG=MacOSX SHELL=/bin/sh "$ROOT/MacOSX/$OBJTYPE/bin/mk" GUIBACK=headless
        test -f o.emu || { echo "Headless emulator build failed"; exit 1; }

    - name: Compile essential dis files
      run: |
        LIMBO="$ROOT/MacOSX/$OBJTYPE/bin/limbo"

        # Verify limbo works
        echo "Using limbo: $LIMBO"
        "$LIMBO" -w 2>&1 || true

        # emuinit + shell (these must succeed)
        echo "Compiling emuinit.b..."
        "$LIMBO" -I./module -gw appl/cmd/emuinit.b
        cp emuinit.dis dis/

        echo "Compiling sh.b..."
        (cd appl/cmd/sh && ../../../MacOSX/$OBJTYPE/bin/limbo -I../../../module -gw sh.b && cp sh.dis ../../../dis/)

        # Core commands
        for cmd in cat ls pwd echo date; do
          echo "Compiling $cmd.b..."
          "$LIMBO" -I./module -gw "appl/cmd/$cmd.b" && cp "$cmd.dis" dis/ || echo "WARNING: $cmd.b compilation failed"
        done

        # Essential libraries
        mkdir -p dis/lib
        cd appl/lib
        for f in bufio.b string.b readdir.b arg.b; do
          echo "Compiling lib/$f..."
          "../../MacOSX/$OBJTYPE/bin/limbo" -I../../module -gw "$f" || echo "WARNING: $f compilation failed"
        done
        cp bufio.dis string.dis readdir.dis arg.dis ../../dis/lib/ 2>/dev/null || true
        cd "$ROOT"

        # Verify critical .dis files exist (from compilation or git checkout)
        echo "Verifying essential .dis files..."
        for f in dis/emuinit.dis dis/sh.dis dis/cat.dis dis/ls.dis dis/pwd.dis; do
          if [ -f "$f" ]; then
            echo "  OK: $f ($(wc -c < "$f") bytes)"
          else
            echo "  MISSING: $f"
          fi
        done

    - name: Build runtime tree
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:$PATH"
        ./tools/verify-dis-build.sh

    - name: Compile test suite
      run: |
        LIMBO="$ROOT/MacOSX/$OBJTYPE/bin/limbo"
        mkdir -p dis/lib

        # Build testing library
        COMPILE_FAILURES=0
        if [ -d tests/testing ]; then
          cd tests/testing
          for f in *.b; do
            if [ -f "$f" ]; then
              if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/dis/lib/${f%.b}.dis" "$f" 2>&1; then
                echo "ERROR: Failed to compile testing/$f"
                COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
              fi
            fi
          done
          cd "$ROOT"
        fi

        # Build test runner and test files into tests/ where the runner expects them
        cd tests
        for f in *.b; do
          name="${f%.b}"
          echo "Compiling $f..."
          if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/tests/$name.dis" "$f" 2>&1; then
            echo "ERROR: Failed to compile $f"
            COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
          fi
        done
        cd "$ROOT"

        test -f tests/runner.dis || { echo "Test runner not compiled"; exit 1; }

        echo "Compiled test .dis files:"
        ls tests/*_test.dis 2>/dev/null | wc -l

        if [ "$COMPILE_FAILURES" -gt 0 ]; then
          echo "ERROR: $COMPILE_FAILURES test file(s) failed to compile"
          exit 1
        fi

    - name: Run memdraw rasteriser and fast-path checks
      run: |
        # libmemdraw/aatest.c: exact coverage, fill rules, strokes, and the
        # special cases (coverdraw, blenddraw) against the general alphadraw
        # byte for byte.  Built with this runner's compiler: an unsequenced
        # temporary in coverdraw passed under clang and drew every
        # anti-aliased glyph black under gcc.  The libraries are built
        # above, so a skip (77) here is a failure.
        ROOT=. sh tests/host/aa_test.sh

    - name: Run sh script-execution check
      run: |
        # A script without the execute bit must be reported as such,
        # not as a missing .dis module (what Xenith's B2 showed), and
        # must not hide a command later on the path. 77 = skip (no emu).
        chmod +x tests/host/sh_noexec_script_test.sh
        rc=0
        ROOT=. bash tests/host/sh_noexec_script_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run test suite
      run: |
        # Create /tmp inside Inferno root for tmp_writable test
        mkdir -p tmp

        echo "Running test suite inside Inferno emulator..."
        # The emulator doesn't exit cleanly after the test runner finishes
        # (kernel threads keep the process alive), so we capture output and
        # parse the result instead of relying on exit code.
        # Deterministic completion (see Linux jobs): wait for the runner's
        # own "Total:" summary line rather than a fixed timeout, then stop emu.
        ./emu/MacOSX/o.emu -r . /tests/runner.dis -v > test-output.txt 2>&1 &
        EMU_PID=$!
        START=$SECONDS
        while kill -0 $EMU_PID 2>/dev/null; do
          grep -q "^Total:" test-output.txt 2>/dev/null && break
          [ $((SECONDS-START)) -ge ${{ matrix.backstop }} ] && { echo "Backstop hit (${{ matrix.backstop }}s) with no Total: line — possible hang."; break; }
          sleep 2
        done
        kill -9 $EMU_PID 2>/dev/null || true
        wait $EMU_PID 2>/dev/null || true

        cat test-output.txt

        # Gating: the suite must finish (the runner's Total: line) and
        # fail nothing.  The runner gives each test its own namespace and
        # a time limit, so one test can neither break the next nor hold
        # the suite; a test whose environment is absent here skips.
        if ! grep -q "^Total:" test-output.txt; then
          echo "::error::The suite did not finish within the backstop. Last test started:"
          grep "^=== RUN" test-output.txt | tail -1 || true
          exit 1
        fi
        grep "^Total:" test-output.txt | tail -1
        if grep -q "^--- FAIL:" test-output.txt; then
          echo "::error::Failing tests:"
          grep "^--- FAIL:" test-output.txt
          exit 1
        fi

    - name: Run port verification
      run: |
        chmod +x verify-port.sh
        ./verify-port.sh

    - name: Run JIT fault and bounds tests (JIT and interpreter)
      run: |
        # Gating, unlike the suite above: faults raised from compiled
        # code must be the interpreter's exceptions, caught by the
        # handler around them. The arm64 JIT failed both while the
        # suite's non-gating run hid it.  On Intel this is the amd64
        # JIT's only macOS hardware.
        ROOT=. sh tests/host/jit_fault_test.sh
        ROOT=. sh tests/host/jit_bounds_test.sh
        ROOT=. sh tests/host/utf21_test.sh

    - name: Run ML-DSA decompose test
      run: |
        # Decompose sees values derived from the signing key, so it must
        # not divide (a hardware divide's time depends on its operands;
        # cf. CVE-2026-22705). Whether a compiler emits one is per
        # architecture, hence on every runner. Host C, no emulator.
        ROOT=. bash tests/host/mldsa_decompose_test.sh

    - name: Run wallet and secstore integration tests
      run: |
        echo "Running host-side integration tests..."

        # wallet9p policy surface (offline, deterministic — a failure here
        # means the wallet's budget/approval/signing policy regressed, so
        # it fails the build; exit 77 = no emu available, skip)
        if [ -f tests/host/wallet9p_test.sh ]; then
          echo "--- wallet9p test ---"
          chmod +x tests/host/wallet9p_test.sh
          set +e
          ROOT=. bash tests/host/wallet9p_test.sh > wallet9p-test.txt 2>&1
          rc=$?
          set -e
          cat wallet9p-test.txt
          if [ $rc -eq 0 ]; then
            echo "wallet9p test: PASS"
          elif [ $rc -eq 77 ]; then
            echo "wallet9p test: SKIP (emu not built)"
          else
            echo "wallet9p test: FAIL"
            exit 1
          fi
        fi

        # wallet persistence (secstore round-trip)
        if [ -f tests/host/wallet_persist_test.sh ]; then
          echo "--- wallet persistence test ---"
          chmod +x tests/host/wallet_persist_test.sh
          ROOT=. bash tests/host/wallet_persist_test.sh > wallet-persist-test.txt 2>&1 || true
          cat wallet-persist-test.txt
          if grep -q "^PASS$" wallet-persist-test.txt; then
            echo "wallet persistence test: PASS"
          else
            echo "wallet persistence test: FAIL (non-fatal in CI)"
          fi
        fi

    - name: Upload macOS build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: infernode-macos-${{ matrix.arch }}
        path: |
          emu/MacOSX/o.emu
          MacOSX/${{ matrix.arch }}/bin/limbo
          MacOSX/${{ matrix.arch }}/bin/mk
        retention-days: 14

    # The SDL3 emulator, as the release builds it, and the GUI tests under
    # SDL's windowless driver: the steps above build the headless one, so
    # without these nothing that needs a display is tested on a Mac.  On
    # the Apple Silicon runner only, in this job rather than one of its
    # own: macos-15 runners are scarce at busy hours, and a job left
    # queued for one is cancelled.
    - name: Build SDL3 GUI emulator
      if: matrix.arch == 'arm64'
      run: |
        export PATH="$ROOT/MacOSX/$OBJTYPE/bin:/usr/bin:/bin"
        (cd libfreetype && mk install) || true
        cd emu/MacOSX
        # the headless build's objects were compiled without -DGUI_SDL3
        rm -f *.o o.emu
        SYSTARG=MacOSX SHELL=/bin/sh mk GUIBACK=sdl3
        test -f o.emu || { echo "Emulator build failed"; exit 1; }
        nm o.emu | grep -q sdl3_mainloop || { echo "o.emu is not the SDL3 build"; exit 1; }

    - name: Run GUI tests
      if: matrix.arch == 'arm64'
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        # As the Linux GUI job; wm_cursor_test needs LD_PRELOAD and skips
        # here (77).
        failed=
        for t in wm_test wm_cursor_test wm_size_test wm_theme_test wm_ghost_test wm_shell_test wm_editor_keys_test wm_edit_test wm_dir_test ftree_test page_test sam_gui_test lucifer_app_test lucictx_event_test; do
          echo "--- $t ---"
          rc=0
          ROOT=. sh tests/host/$t.sh || rc=$?
          case $rc in
          0)	;;
          77)	echo "($t skipped)" ;;
          *)	failed="$failed $t" ;;
          esac
        done
        [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  # ─────────────────────────────────────────────
  # Windows AMD64: MSVC build from source
  # ─────────────────────────────────────────────
  ios:
    name: iOS Build & Simulator Test
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The iOS scripts drive the host's mk and limbo, and bundle dis/ into
    # the app, so the host side is built first.
    - name: Build the host's mk and limbo, and the Dis tree
      run: |
        set -e
        ./makemk.sh
        export PATH="$ROOT/MacOSX/arm64/bin:$PATH"
        for d in lib9 libbio libmp libsec libmath utils/iyacc limbo; do
          (cd "$d" && mk install)
        done
        for d in appl appl/mpeg appl/veltro tests; do
          (cd "$d" && mk install) > "/tmp/dis-$(basename "$d").log" 2>&1 || {
            grep -E '\.b:[0-9]+:' "/tmp/dis-$(basename "$d").log" | grep -v 'warning:' | head -40
            echo "::error::mk install failed in $d"; exit 1; }
        done

    - name: Cross-build the simulator slice
      run: ./build-ios-arm64.sh > /tmp/ios-sim.log 2>&1 || { tail -40 /tmp/ios-sim.log; exit 1; }

    - name: Boot a simulator
      run: |
        UDID=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F-]{36}')
        test -n "$UDID" || { echo "::error::no iPhone simulator available"; exit 1; }
        xcrun simctl boot "$UDID"
        xcrun simctl bootstatus "$UDID"

    # Headless app: boots emu from the bundled root and runs hello_test.
    - name: Headless app runs a test inside iOS
      run: ./build-ios-app.sh --verify

    - name: Cache SDL3 for iOS
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/sdks/SDL3-ios-sim-arm64
        key: sdl3-ios-sim-3.2.26-${{ runner.os }}

    # GUI app: the script launches it but asserts nothing, so watch the
    # console for the presentation view coming up, the last step of a
    # Lucifer boot.
    - name: GUI app boots Lucifer
      run: |
        ./build-sdl3-ios.sh > /tmp/sdl3.log 2>&1 || { tail -40 /tmp/sdl3.log; exit 1; }
        ./build-ios-app.sh --gui
        xcrun simctl terminate booted os.infernode.ios || true
        ( xcrun simctl launch --console-pty booted os.infernode.ios > /tmp/ios-gui.log 2>&1 ) &
        for i in $(seq 1 24); do
          grep -q 'lucipres: plumb consumer listening' /tmp/ios-gui.log && break
          sleep 5
        done
        grep -vE '^$' /tmp/ios-gui.log | tail -40
        grep -q 'lucipres: plumb consumer listening' /tmp/ios-gui.log || {
          echo "::error::Lucifer did not finish booting in the iOS Simulator"; exit 1; }

    # Device slice: compile only. Installing needs signing and hardware.
    - name: Cross-build the device slice
      run: |
        IOSSDK=iphoneos ./build-ios-arm64.sh > /tmp/ios-dev.log 2>&1 || { tail -40 /tmp/ios-dev.log; exit 1; }

  windows-amd64:
    name: Windows AMD64 Build & Test
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Stamp build version
      shell: powershell
      run: |
        $buildDate = Get-Date -Format "yyyyMMdd"
        $shortSha = $env:GITHUB_SHA.Substring(0, 8)
        $versionFile = "include/version.h"
        (Get-Content $versionFile) -replace 'InferNode 0.1', "InferNode 0.1 build $buildDate-$shortSha" | Set-Content $versionFile
        Write-Host "Version: $(Get-Content $versionFile)"

    - name: Install build dependencies
      shell: powershell
      run: |
        # Verify the package actually landed, not just choco's exit code.
        # The Chocolatey community feed intermittently returns an HTML
        # error page instead of XML ("not valid XML" -> "0/0 packages")
        # yet still exits 0, so an exit-code-only check goes green with no
        # bison installed and the build hangs scanning for it later. Probe
        # for win_bison.exe after each attempt and retry until it appears.
        $attempts = 3
        for ($attempt = 1; $attempt -le $attempts; $attempt++) {
          choco install winflexbison3 -y --no-progress
          $bin = Get-ChildItem -Path "$env:ProgramData\chocolatey\lib\winflexbison3" -Filter win_bison.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($bin) {
            Write-Host "win_bison.exe installed at $($bin.FullName)"
            break
          }
          if ($attempt -eq $attempts) {
            throw "Failed to install winflexbison3 after $attempts attempts (win_bison.exe not found; likely a Chocolatey feed outage)"
          }
          Write-Warning "winflexbison3 not installed on attempt $attempt (choco exit $LASTEXITCODE, win_bison.exe missing); retrying..."
          Start-Sleep -Seconds (15 * $attempt)
        }

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: amd64

    - name: Bootstrap build (mk, libraries, limbo, emulator)
      shell: powershell
      run: |
        .\build-windows-amd64.ps1

    - name: Verify emulator binary
      shell: powershell
      run: |
        if (-not (Test-Path 'emu\Nt\o.emu.exe')) {
          Write-Error "Emulator not built"
          exit 1
        }
        Get-Item 'emu\Nt\o.emu.exe'
        if (-not (Test-Path 'Nt\amd64\bin\limbo.exe')) {
          Write-Error "Limbo compiler not built"
          exit 1
        }

    - name: Launchers carry the release's version
      shell: powershell
      run: |
        # InferNode.exe and Xenith.exe take their version (Properties >
        # Details) from include/version.h, which the release stamps with
        # its tag; stamp one here as the release does and check both.
        (Get-Content include\version.h) -replace 'InferNode 0.1', 'InferNode 9.8.7 build ci' | Set-Content include\version.h
        & .\emu\Nt\build-launcher.ps1
        if ($LASTEXITCODE -ne 0) { Write-Error "launcher build failed"; exit 1 }
        foreach ($exe in @('InferNode.exe', 'Xenith.exe')) {
          $v = (Get-Item "emu\Nt\$exe").VersionInfo
          Write-Host "$exe : $($v.ProductVersion) / $($v.FileVersion) / $($v.CompanyName)"
          if ($v.ProductVersion -ne '9.8.7' -or $v.FileVersion -ne '9.8.7' -or
              $v.FileMajorPart -ne 9 -or $v.FileMinorPart -ne 8 -or $v.FileBuildPart -ne 7 -or
              $v.CompanyName -ne 'InferNode.io') {
            Write-Error "$exe has the wrong version info"
            exit 1
          }
        }
        git checkout -- include\version.h

    - name: Run test suite (informational on Windows)
      shell: powershell
      # Windows-specific test-infrastructure issue: the test runner dies
      # after the first Inferno-shell test attempts mkdir on a nested
      # path that doesn't exist, before emitting the PASS/FAIL summary.
      # The same suite is green on Linux and macOS, and end-users have
      # verified the port works interactively. Treat the verdict as
      # informational until the runner is fixed (INFR-51).
      continue-on-error: true
      run: |
        # Create tmp directory inside Inferno root for tmp_writable test
        New-Item -ItemType Directory -Force -Path tmp

        Write-Host "Running test suite inside Inferno emulator..."
        # Match Linux/macOS: merge stderr into stdout via cmd /c, because
        # the test runner writes PASS/FAIL to fildes(2) and we grep one
        # combined transcript for the verdict.
        $emu = (Resolve-Path '.\emu\Nt\o.emu.exe').Path
        $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', "`"$emu`" -c1 -r . /dis/tests/runner.dis -v > test-output.txt 2>&1" -NoNewWindow -PassThru
        $timedOut = $null
        $proc | Wait-Process -Timeout 60 -ErrorVariable timedOut -ErrorAction SilentlyContinue
        if ($timedOut) {
          Write-Host "Test process timed out after 60 seconds, killing..."
          $proc | Stop-Process -Force
        }

        Get-Content 'test-output.txt'

        $output = Get-Content 'test-output.txt' -Raw
        if ($output -match '(?m)^PASS$') {
          Write-Host "Tests passed."
        } elseif ($output -match '(?m)^FAIL$') {
          Write-Warning "Tests failed (non-blocking on Windows; see INFR-51)."
        } else {
          Write-Warning "No test result found in output (non-blocking on Windows; see INFR-51)."
        }

    - name: Run JIT correctness tests
      shell: powershell
      run: |
        Write-Host "Running JIT correctness tests (-c1)..."
        $emu = (Resolve-Path '.\emu\Nt\o.emu.exe').Path
        $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', "`"$emu`" -c1 -r . /dis/jittest.dis > jit-test.txt 2>&1" -NoNewWindow -PassThru
        $timedOut = $null
        $proc | Wait-Process -Timeout 120 -ErrorVariable timedOut -ErrorAction SilentlyContinue
        if ($timedOut) {
          Write-Host "JIT test process timed out after 120 seconds, killing..."
          $proc | Stop-Process -Force
        }

        Get-Content 'jit-test.txt'

        $output = Get-Content 'jit-test.txt' -Raw
        if ($output -match '(?m)^PASS$') {
          Write-Host "JIT correctness tests: PASS"
        } else {
          Write-Error "JIT correctness tests: FAIL"
          exit 1
        }

    - name: Run JIT benchmarks (informational)
      shell: powershell
      run: |
        Write-Host "Running JIT benchmarks..."
        $emu = (Resolve-Path '.\emu\Nt\o.emu.exe').Path
        $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', "`"$emu`" -c1 -r . /dis/jitbench2.dis > jit-bench.txt 2>&1" -NoNewWindow -PassThru
        $timedOut = $null
        $proc | Wait-Process -Timeout 180 -ErrorVariable timedOut -ErrorAction SilentlyContinue
        if ($timedOut) {
          Write-Host "JIT benchmark timed out after 180 seconds, killing..."
          $proc | Stop-Process -Force
        }

        Get-Content 'jit-bench.txt'
        Write-Host "JIT benchmarks complete (informational only)."

    - name: Upload Windows build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: infernode-windows-amd64
        path: |
          emu\Nt\o.emu.exe
          Nt\amd64\bin\limbo.exe
          Nt\amd64\bin\mk.exe
        retention-days: 14
