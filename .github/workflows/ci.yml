name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Ring-fence pre-flight: adversarial campaign infrastructure lives in the
  # external infernode-escape-room repository, never in product artifacts.
  # ─────────────────────────────────────────────
  ring-fence:
    name: Ring-fence (external harness)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Reject external harness files in the product tree
      run: |
        offenders=$(find . -path ./.git -prune -o \
          \( -name 'serve-agent*' -o -path '*agent-harness*' \) \
          -print 2>/dev/null | grep -v '^$' || true)
        if [ -n "$offenders" ]; then
          echo "FATAL: external escape-room harness files found in InferNode:" >&2
          echo "$offenders" >&2
          echo "" >&2
          echo "Keep campaign infrastructure in infernode-os/infernode-escape-room." >&2
          exit 1
        fi
        echo "Ring-fence OK: external harness material is absent."

    - name: Verify local-only config files are not tracked
      run: |
        # lib/ndb/llm holds a developer's LLM endpoints, gateway URLs and
        # model choices. It is .gitignore'd — but .gitignore does nothing
        # for a file that is already tracked, which is how a private LAN
        # host reached the public repo once before. Ship lib/ndb/llm.example
        # instead; release.yml writes distribution defaults into artifacts.
        offenders=""
        for f in lib/ndb/llm lib/ndb/local; do
          if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
            offenders="$offenders $f"
          fi
        done
        if [ -n "$offenders" ]; then
          echo "FATAL: local-only config files are tracked:$offenders" >&2
          echo "" >&2
          echo "Untrack them (git rm --cached <file>) and keep the tracked" >&2
          echo "template (<file>.example) as the shipped default." >&2
          exit 1
        fi
        if [ ! -f lib/ndb/llm.example ]; then
          echo "FATAL: lib/ndb/llm.example is missing — first run has no template to seed from." >&2
          exit 1
        fi
        echo "Config ring-fence OK: local-only config untracked, template present."

  # ─────────────────────────────────────────────
  # Linux AMD64: Full bootstrap build from source
  # ─────────────────────────────────────────────
  linux-amd64:
    name: Linux AMD64 Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Stamp build version
      run: |
        BUILD_DATE=$(date +%Y%m%d)
        SHORT_SHA=${GITHUB_SHA::8}
        sed -i "s|InferNode 0.1|InferNode 0.1 build ${BUILD_DATE}-${SHORT_SHA}|" include/version.h
        echo "Version: $(cat include/version.h)"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libfido2-dev libudev-dev

    - name: Bootstrap build (mk, libraries, limbo, emulator)
      run: |
        chmod +x build-linux-amd64.sh
        # Explicit headless: this job installs no SDL3, so the script's
        # default sdl3 mode would fail the pkg-config check and fall back
        # to headless anyway. Pass it outright so the "headless build"
        # guarantee doesn't depend on that fallback (matches linux-arm64).
        ./build-linux-amd64.sh headless

    - name: Verify emulator binary
      run: |
        test -x emu/Linux/o.emu || { echo "Emulator not built"; exit 1; }
        file emu/Linux/o.emu
        test -x Linux/amd64/bin/limbo || { echo "Limbo compiler not built"; exit 1; }

    - name: Verify libfido2 linkage (/dev/2fa)
      run: |
        # libfido2-dev is installed, so the headless emu must link libfido2 or
        # the #F device would ship as a stub. Same guard as the GUI jobs.
        ldd emu/Linux/o.emu | grep -i libfido2 || { echo "Emulator not linked against libfido2 — /dev/2fa would be a stub"; exit 1; }

    - name: Build runtime tree
      run: |
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        ./tools/verify-dis-build.sh

    - name: Check mkfile header dependencies
      run: |
        # Every module header a Limbo source includes, at any depth, is a
        # prerequisite of its .dis: one that is not changes without mk
        # rebuilding, and the stale .dis fails at load (link typecheck).
        python3 tools/check-mkfile-deps.py

    - name: Compile test suite
      run: |
        LIMBO="$ROOT/Linux/amd64/bin/limbo"

        # Build the testing module first
        mkdir -p dis/tests dis/lib

        # Build testing library
        COMPILE_FAILURES=0
        if [ -d tests/testing ]; then
          cd tests/testing
          for f in *.b; do
            if [ -f "$f" ]; then
              if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/dis/lib/${f%.b}.dis" "$f" 2>&1; then
                echo "ERROR: Failed to compile testing/$f"
                COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
              fi
            fi
          done
          cd "$ROOT"
        fi

        # Build test runner and test files into tests/ where the runner expects them
        cd tests
        for f in *.b; do
          name="${f%.b}"
          echo "Compiling $f..."
          if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/tests/$name.dis" "$f" 2>&1; then
            echo "ERROR: Failed to compile $f"
            COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
          fi
        done
        cd "$ROOT"

        # Verify runner was compiled
        test -f tests/runner.dis || { echo "Test runner not compiled"; exit 1; }

        echo "Compiled test .dis files:"
        ls tests/*_test.dis 2>/dev/null | wc -l

        if [ "$COMPILE_FAILURES" -gt 0 ]; then
          echo "ERROR: $COMPILE_FAILURES test file(s) failed to compile"
          exit 1
        fi

    - name: Run namespace audit checks
      run: |
        echo "Running nsaudit security checks..."
        chmod +x tests/host/nsaudit_rules_test.sh
        chmod +x tests/host/nsaudit_profiles_test.sh
        chmod +x tests/host/nsaudit_path_semantics_test.sh
        chmod +x tests/host/namespace_path_policy_test.sh
        chmod +x tests/host/namespace_manifest_invariants_test.sh
        chmod +x tests/host/veltro_namespace_failclosed_test.sh

        ROOT=. bash tests/host/nsaudit_rules_test.sh
        ROOT=. bash tests/host/nsaudit_profiles_test.sh
        ROOT=. bash tests/host/nsaudit_path_semantics_test.sh
        ROOT=. bash tests/host/namespace_path_policy_test.sh
        ROOT=. bash tests/host/namespace_manifest_invariants_test.sh
        ROOT=. bash tests/host/veltro_namespace_failclosed_test.sh

    - name: Check an idle emulator uses no CPU
      run: |
        # With a web page loaded and nothing to do, the idle collector
        # kept going round the heap: a core, for as long as it sat idle.
        chmod +x tests/host/idle_cpu_test.sh
        ROOT=. bash tests/host/idle_cpu_test.sh

    - name: Check a form a page's script submits is posted
      run: |
        # form.submit() of a POST form was only logged as unsupported, so
        # a sign-in posting the password from script went nowhere.
        chmod +x tests/host/js_formpost_test.sh
        ROOT=. bash tests/host/js_formpost_test.sh

    - name: Check a long POST body is sent whole
      run: |
        chmod +x tests/host/charon_bigpost_test.sh
        ROOT=. bash tests/host/charon_bigpost_test.sh

    - name: Check Charon's start page ships
      run: |
        # The start page must be a file every release package carries
        # (it was a test fixture, missing from every package).
        chmod +x tests/host/charon_home_test.sh
        ROOT=. bash tests/host/charon_home_test.sh

    - name: Check the forms file lists the page's controls
      run: |
        # Form numbers came from the order nodes were made: a control a
        # script moved into a form was in none, and was not sent with it;
        # removed and never-attached controls were listed as on the page.
        chmod +x tests/host/charon_forms_test.sh
        ROOT=. bash tests/host/charon_forms_test.sh

    - name: Check a form's controls are the ones HTML puts in it
      run: |
        # A template's input was listed and sent, a control's form
        # attribute was ignored, and entries went in the order nodes were
        # made; both through Charon's files and from the page's scripts.
        chmod +x tests/host/charon_formowner_test.sh
        ROOT=. bash tests/host/charon_formowner_test.sh

    - name: Check a button's label in the files is the one shown
      run: |
        # A web component's button showed no label in forms or dom/N/text:
        # its label is what the page put in the component, shown through a
        # slot, and the files read only the button's own subtree.
        chmod +x tests/host/charon_shadowlabel_test.sh
        ROOT=. bash tests/host/charon_shadowlabel_test.sh

    - name: Check a label in a shadow tree checks its own checkbox
      run: |
        chmod +x tests/host/charon_shadowcheck_test.sh
        ROOT=. bash tests/host/charon_shadowcheck_test.sh

    - name: Check an image a page's script puts in is fetched
      run: |
        chmod +x tests/host/charon_scriptimg_test.sh
        ROOT=. bash tests/host/charon_scriptimg_test.sh

    - name: Check a web component laid out as a grid takes the page's areas
      run: |
        chmod +x tests/host/charon_shadowgrid_test.sh
        ROOT=. bash tests/host/charon_shadowgrid_test.sh

    - name: Check a PDF navigated to is saved and opened
      run: |
        chmod +x tests/host/charon_download_test.sh
        ROOT=. bash tests/host/charon_download_test.sh

    - name: Check a link to audio is saved, not parsed as a page
      run: |
        chmod +x tests/host/charon_notpage_test.sh
        ROOT=. bash tests/host/charon_notpage_test.sh

    - name: Check the DOM a page's scripts see
      run: |
        # tests/js/pages/dom.html checks lib/js/dom.js from inside a page;
        # nothing ran it, and dom.js told pages CSS animates, which it
        # does not, so Microsoft's sign-in never left its first step.
        chmod +x tests/host/js_dom_test.sh
        ROOT=. bash tests/host/js_dom_test.sh

    - name: Check a page's scripts get and send bytes as they are
      run: |
        # A body was kept as text only: bytes that are not UTF-8 read
        # through arrayBuffer() came back mangled (JSTOR's sign-in check
        # failed so), and an ArrayBuffer posted was sent re-encoded.
        chmod +x tests/host/js_binary_test.sh
        ROOT=. bash tests/host/js_binary_test.sh

    - name: Check a page's files do not show a password
      run: |
        # The forms and dom/N/attrs files showed a password field's value
        # as typed, to anything that could read a browser window's files.
        chmod +x tests/host/charon_password_test.sh
        ROOT=. bash tests/host/charon_password_test.sh

    - name: Check releases ship the system's directories
      run: |
        # man, doc, icons, appl (without its .dis) and n, in every
        # release package; without n a fresh install's first start
        # made the user's home inside the package.
        chmod +x tests/host/release_dirs_test.sh
        ROOT=. bash tests/host/release_dirs_test.sh
        # No private key in a release package: the tree's
        # usr/inferno/keyring/default (a test key) is scrubbed by every
        # package job, and a key left anywhere refuses the package.
        chmod +x tests/host/release_scrub_test.sh
        ROOT=. bash tests/host/release_scrub_test.sh

    - name: Check the tree's icons
      run: |
        # icons/ holds icon(2)'s glyphs (icons/ui), Tk's cursors and the
        # artwork coffee and draw-example(2) draw, nothing else; every
        # glyph a program names is there, and no Tk bitmap or /icons
        # path a program names is missing (one missing fails the widget
        # naming it).
        ROOT=. sh tests/host/icons_test.sh

    - name: Check what goes on a Raspberry Pi card image
      run: |
        # tools/mkpiimage.sh, which makes the release's card images: each
        # board's firmware, config.txt and kernel, the built dis/, and of
        # lib/ fonts/ icons/ only what git tracks; read back by the test's
        # own FAT32 reader, and by fsck.fat.
        sudo apt-get install -y dosfstools
        ROOT=. bash tests/host/piimage_test.sh

    - name: Run codex-gate preflight checks
      run: |
        # INFR-413: the gateway pins the Codex CLI's plugin, app, MCP, skill,
        # memory and shell-snapshot surface, refuses an isolated Codex home
        # that holds unsanctioned configuration, and reports what it pinned.
        # Mock backend — no CLI, no billing; the pinned feature names are
        # validated against the installed CLI only when one is present.
        chmod +x tests/host/codex_gate_test.sh
        # 77 is the suite's skip status (no aiohttp on the runner).
        rc=0
        ROOT=. bash tests/host/codex_gate_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run llmsrv session capability checks
      run: |
        chmod +x tests/host/llmsrv_session_capability_test.sh
        ROOT=. tests/host/llmsrv_session_capability_test.sh

    - name: Run login-profile proxy import check
      run: |
        # The host's HTTPS_PROXY and no_proxy reach Inferno's environment,
        # where llmclient reads them (INFR-307). 77 = skip (no emu).
        chmod +x tests/host/profile_proxy_test.sh
        rc=0
        ROOT=. bash tests/host/profile_proxy_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run agent harness checks
      run: |
        # The one agent loop, veltrosrv, through its files and through its
        # clients, against a scripted model (tests/host/agentloop): the
        # contract of /mnt/veltro, the veltro command, and what the loop
        # sends back to the model after each tool call, pinned as golden
        # files.  lucibridge's scenarios drive it through /mnt/ui as the
        # grind driver does; a subset here, the full set is
        # `tests/host/agentloop_characterization_test.sh`.
        chmod +x tests/host/veltrosrv_test.sh tests/host/veltro_cli_test.sh \
          tests/host/lucibridge_tool_timeout_test.sh \
          tests/host/agentloop_characterization_test.sh \
          tests/host/tools9p_result_test.sh tests/host/toolctl_view_test.sh \
          tests/host/wiki9p_test.sh \
          tests/host/agent_delegation_test.sh tests/host/prompt_defaults_test.sh \
          tests/host/luciuisrv_closed_test.sh tests/host/compaction_test.sh \
          tests/host/context_window_test.sh
        # Concurrent calls to one tool each read their own result.
        ROOT=. bash tests/host/tools9p_result_test.sh
        # /mnt/toolctl's ns, event and view: the agent's name space as it
        # is, read-only, and its lists' changes as events (#1020).
        ROOT=. bash tests/host/toolctl_view_test.sh
        ROOT=. bash tests/host/lucibridge_tool_timeout_test.sh
        ROOT=. bash tests/host/veltrosrv_test.sh
        ROOT=. bash tests/host/veltro_cli_test.sh
        # Activity 0 delegating to a task agent through lucibridge: the
        # task's tools, activity 0's afterwards, the completion event.
        ROOT=. bash tests/host/agent_delegation_test.sh
        # The agent prompts in ~/.infernode follow the shipped defaults
        # until edited; every shipped version's hash is listed.
        ROOT=. bash tests/host/prompt_defaults_test.sh
        # A closed activity refuses writes and the server survives them.
        ROOT=. bash tests/host/luciuisrv_closed_test.sh
        # A long session is compacted without breaking a turn of tool calls.
        ROOT=. bash tests/host/compaction_test.sh
        ROOT=. bash tests/host/context_window_test.sh
        # The LLM-maintained wiki (wiki9p over wikifs) against a scripted model.
        ROOT=. bash tests/host/wiki9p_test.sh
        ROOT=. FRONTENDS=veltrosrv bash tests/host/agentloop_characterization_test.sh
        ROOT=. FRONTENDS=lucibridge bash tests/host/agentloop_characterization_test.sh \
          single_read two_reads write_then_read error_streak say step_cap

    - name: Run memdraw rasteriser and fast-path checks
      run: |
        # libmemdraw/aatest.c: exact coverage, fill rules, strokes, and the
        # special cases (coverdraw, blenddraw) against the general alphadraw
        # byte for byte.  Built with this runner's compiler: an unsequenced
        # temporary in coverdraw passed under clang and drew every
        # anti-aliased glyph black under gcc.  The libraries are built
        # above, so a skip (77) here is a failure.
        ROOT=. sh tests/host/aa_test.sh

    - name: Run headless Tk application check
      run: |
        # A Tk application with no window manager waits for events
        # rather than spinning, and its 9P files answer (INFR-365):
        # wm/editor's /edit, written and read back, then its idle CPU
        # time measured. 77 = skip (no emu or dis tree).
        chmod +x tests/host/editor_headless_test.sh
        rc=0
        ROOT=. bash tests/host/editor_headless_test.sh || rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then exit "$rc"; fi

    - name: Run sh script-execution check
      run: |
        # A script without the execute bit must be reported as such,
        # not as a missing .dis module (what Xenith's B2 showed), and
        # must not hide a command later on the path. 77 = skip (no emu).
        chmod +x tests/host/sh_noexec_script_test.sh
        rc=0
        ROOT=. bash tests/host/sh_noexec_script_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run dossrv badent alias check
      run: |
        # dossrv must decide "damaged entry" from the on-disk name, not
        # the badent- alias it hands out: a healthy file named badent-1
        # has to have its clusters freed by rm. The same fixture runs
        # under QEMU in baremetal_test.sh, which no workflow runs; this
        # is the hosted copy, against the emu built above. 77 = skip
        # (no emu or python3).
        chmod +x tests/host/dossrv_badent_test.sh
        rc=0
        ROOT=. bash tests/host/dossrv_badent_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"
        # Long-name slots that are orphaned, mis-summed or out of
        # sequence must not become a file's name (#673).
        chmod +x tests/host/dossrv_lfn_test.sh
        rc=0
        ROOT=. bash tests/host/dossrv_lfn_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"
        # The radio firmware tool's verification path: a mismatched
        # checksum must refuse to install. Network-free (--from a
        # fixture directory), under a second.
        chmod +x tests/host/pi_firmware_test.sh
        ROOT=. bash tests/host/pi_firmware_test.sh
        # A wstat's "don't change" fields must change nothing on a
        # 64-bit host: mv inside InferNode used to leave a host file
        # mode 777 with a modification time in 2106. 77 = skip (no emu).
        chmod +x tests/host/wstat_nulldir_test.sh
        rc=0
        ROOT=. bash tests/host/wstat_nulldir_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"
        # An allocation the pool refuses says how much, why, for whom
        # and how the pool stood (INFR-472). 77 = skip (no emu).
        chmod +x tests/host/pool_nomem_test.sh
        rc=0
        ROOT=. bash tests/host/pool_nomem_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run WPA2 supplicant vector checks
      run: |
        # The supplicant's cryptography against RFC 6070, IEEE 802.11i
        # Annex H and RFC 3394, plus a whole four-way handshake driven
        # from synthetic frames. No radio is involved and none can be:
        # this is the only part of the WiFi work a runner can prove.
        # 77 = skip (no emulator built).
        chmod +x tests/host/wpa_vectors_test.sh
        rc=0
        ROOT=. bash tests/host/wpa_vectors_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"
        # And the other half: the supplicant driven against an
        # interface made of plain files, so the conversation, the ctl
        # verbs, the ifstats parsing and the factotum protocol are
        # exercised rather than reasoned about. Message 2's integrity
        # check is recomputed from the nonce it actually used.
        chmod +x tests/host/wpa_join_test.sh
        rc=0
        ROOT=. bash tests/host/wpa_join_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"
        # And what it says while it cannot get a usable link. A board
        # with only a serial console was made unusable by a supplicant
        # that reported every retry; the join test above pipes its log
        # through `sort -u` and so could never have seen it. This one
        # counts lines, and counts the ctl writes beside them so that
        # "quiet" cannot be a supplicant that gave up.
        chmod +x tests/host/wpa_backoff_test.sh
        rc=0
        ROOT=. bash tests/host/wpa_backoff_test.sh || rc=$?
        [ "$rc" = 0 ] || [ "$rc" = 77 ] || exit "$rc"

    - name: Run test suite
      run: |
        # Create /tmp inside Inferno root for tmp_writable test
        mkdir -p tmp

        echo "Running test suite inside Inferno emulator..."
        # Deterministic completion: emu never exits cleanly (kernel threads
        # keep it alive) and the suite legitimately runs for minutes
        # (crypto_test alone is ~170s), so a fixed `timeout` truncates it.
        # Run emu in the background and wait for the runner's own "Total:"
        # summary line, then stop it. The backstop (<< the job's
        # timeout-minutes) only bounds a genuine hang. No `timeout` (absent
        # on macOS) so the same shape works everywhere.
        ./emu/Linux/o.emu -c1 -r . /tests/runner.dis -v > test-output.txt 2>&1 &
        EMU_PID=$!
        START=$SECONDS
        while kill -0 $EMU_PID 2>/dev/null; do
          grep -q "^Total:" test-output.txt 2>/dev/null && break
          [ $((SECONDS-START)) -ge 1500 ] && { echo "Backstop hit (1500s) with no Total: line — possible hang."; break; }
          sleep 2
        done
        kill -9 $EMU_PID 2>/dev/null || true
        wait $EMU_PID 2>/dev/null || true

        cat test-output.txt

        # Gating: the suite must finish (the runner's Total: line) and
        # fail nothing.  The runner gives each test its own namespace and
        # a time limit, so one test can neither break the next nor hold
        # the suite; a test whose environment is absent here skips.
        if ! grep -q "^Total:" test-output.txt; then
          echo "::error::The suite did not finish within the backstop. Last test started:"
          grep "^=== RUN" test-output.txt | tail -1 || true
          exit 1
        fi
        grep "^Total:" test-output.txt | tail -1
        if grep -q "^--- FAIL:" test-output.txt; then
          echo "::error::Failing tests:"
          grep "^--- FAIL:" test-output.txt
          exit 1
        fi

    - name: Run wallet and secstore integration tests
      run: |
        echo "Running host-side integration tests..."

        # wallet9p policy surface (offline, deterministic — a failure here
        # means the wallet's budget/approval/signing policy regressed, so
        # it fails the build; exit 77 = no emu available, skip)
        if [ -f tests/host/wallet9p_test.sh ]; then
          echo "--- wallet9p test ---"
          chmod +x tests/host/wallet9p_test.sh
          set +e
          ROOT=. bash tests/host/wallet9p_test.sh > wallet9p-test.txt 2>&1
          rc=$?
          set -e
          cat wallet9p-test.txt
          if [ $rc -eq 0 ]; then
            echo "wallet9p test: PASS"
          elif [ $rc -eq 77 ]; then
            echo "wallet9p test: SKIP (emu not built)"
          else
            echo "wallet9p test: FAIL"
            exit 1
          fi
        fi

        # wallet persistence (secstore round-trip)
        if [ -f tests/host/wallet_persist_test.sh ]; then
          echo "--- wallet persistence test ---"
          chmod +x tests/host/wallet_persist_test.sh
          ROOT=. bash tests/host/wallet_persist_test.sh > wallet-persist-test.txt 2>&1 || true
          cat wallet-persist-test.txt
          if grep -q "^PASS$" wallet-persist-test.txt; then
            echo "wallet persistence test: PASS"
          else
            echo "wallet persistence test: FAIL (non-fatal in CI)"
          fi
        fi

        # audit checkpoint signing (factotum-held key, ML-DSA-87)
        if [ -f tests/host/audit_signing_test.sh ]; then
          echo "--- audit signing test ---"
          chmod +x tests/host/audit_signing_test.sh
          ROOT=. bash tests/host/audit_signing_test.sh > audit-signing-test.txt 2>&1 || true
          cat audit-signing-test.txt
          if grep -q "=== PASS ===" audit-signing-test.txt; then
            echo "audit signing test: PASS"
          else
            echo "audit signing test: SKIP (requires full Inferno namespace)"
          fi
        fi

        # secstored failed-attempt lockout (AC-7 / FIA_AFL.1)
        if [ -f tests/host/secstore_lockout_test.sh ]; then
          echo "--- secstore lockout test ---"
          chmod +x tests/host/secstore_lockout_test.sh
          ROOT=. bash tests/host/secstore_lockout_test.sh > secstore-lockout-test.txt 2>&1 || true
          cat secstore-lockout-test.txt
          if grep -q "=== PASS ===" secstore-lockout-test.txt; then
            echo "secstore lockout test: PASS"
          else
            echo "secstore lockout test: SKIP (requires full Inferno namespace)"
          fi
        fi

    - name: Run presentation file-open regression test
      run: |
        # Boots the Lucifer GUI headless and asserts the file-open contract:
        # Tasks tab present (with the plumber both up and absent), and files
        # route by type (pdf/image/markdown -> presentation, else editor).
        # Non-fatal in CI (full GUI boot can be timing-sensitive).
        if [ -f tests/host/presentation_fileopen_test.sh ]; then
          echo "--- presentation file-open regression test ---"
          chmod +x tests/host/presentation_fileopen_test.sh
          ROOT=. bash tests/host/presentation_fileopen_test.sh > pres-fileopen-test.txt 2>&1 || true
          cat pres-fileopen-test.txt
          if grep -q ", 0 failed," pres-fileopen-test.txt; then
            echo "presentation file-open test: PASS"
          else
            echo "presentation file-open test: SKIP/FAIL (GUI boot timing-sensitive in CI)"
          fi
        fi

    - name: Run presentation tab strip test
      run: |
        # An app in the presentation zone has the tab strip above it, in
        # every one of several headless boots: lucipres and presrender
        # join the zone's wmsrv in either order, and taking the first
        # join for lucipres left the strip blank in about one boot in
        # three.  A boot that is too slow is a skip (77), not a failure.
        rc=0
        ROOT=. bash tests/host/presentation_tabstrip_test.sh || rc=$?
        [ $rc = 0 ] || [ $rc = 77 ]

    - name: Run walk-leak regression test
      run: |
        # A failed name lookup must not leak main-pool memory: namec's
        # handler freed the parsed name through non-volatile locals and
        # clang folded the frees away (3 blocks per miss). Deterministic --
        # it counts live pool blocks across 2000 misses in one emulator --
        # so it is fatal, unlike the GUI-timing tests above.
        chmod +x tests/host/walk_leak_test.sh
        ROOT=. bash tests/host/walk_leak_test.sh
        # And the byte-order accessors in emu/port/ipaux.c against LP64
        # sign extension: compiles the function text out of the tree.
        chmod +x tests/host/nhgetl_test.sh
        ROOT=. bash tests/host/nhgetl_test.sh

    - name: Run ML-DSA decompose test
      run: |
        # Decompose sees values derived from the signing key, so it must
        # not divide (a hardware divide's time depends on its operands;
        # cf. CVE-2026-22705). Whether a compiler emits one is per
        # architecture, hence on every runner. Host C, no emulator.
        ROOT=. bash tests/host/mldsa_decompose_test.sh

    - name: Run JIT correctness tests
      run: |
        echo "Running JIT correctness tests (-c1)..."
        timeout 120 ./emu/Linux/o.emu -c1 -r . /dis/jittest.dis > jit-test.txt 2>&1 < /dev/null || true
        cat jit-test.txt
        if grep -q "^PASS$" jit-test.txt; then
          echo "JIT correctness tests: PASS"
        else
          echo "JIT correctness tests: FAIL"
          exit 1
        fi

    - name: Run JIT boot smoke test
      run: |
        chmod +x tests/host/jit_boot_test.sh
        tests/host/jit_boot_test.sh

    - name: Run JIT bounds tests (JIT and interpreter)
      run: |
        # A negative or overlarge index must raise "array bounds error"
        # from compiled code, not read or write outside the array.
        chmod +x tests/host/jit_bounds_test.sh
        ROOT=. sh tests/host/jit_bounds_test.sh

    - name: Run rune tests beyond U+FFFF (JIT and interpreter)
      run: |
        # U+1F680 and U+20000 are one rune each through byte -> string
        # -> byte, and s[i] reads all 21 bits from compiled code.
        ROOT=. sh tests/host/utf21_test.sh

    - name: Run JIT fault and big arithmetic tests (JIT and interpreter)
      run: |
        # A fault in compiled code is caught by the handler around it,
        # in a callee with a handler of its own too; big *, / and % and
        # hd of a list of big give what the interpreter gives.
        chmod +x tests/host/jit_fault_test.sh tests/host/jit_big_test.sh
        ROOT=. sh tests/host/jit_fault_test.sh
        ROOT=. sh tests/host/jit_big_test.sh

    - name: Run cpu(1) session lifetime test
      run: |
        # A cpu session ends when its command does, or when its caller
        # hangs up, and what it started ends with it (#732).
        ROOT=. sh tests/host/cpu_session_test.sh

    - name: Run JIT type code reuse test
      run: |
        # A freed type's compiled code goes back on comp-amd64.c's free
        # list (#649): 4000 commands must not grow the JIT's resident
        # size more than the interpreter's.
        chmod +x tests/host/amd64_jit_typecode_leak_test.sh
        tests/host/amd64_jit_typecode_leak_test.sh

    - name: Upload Linux build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: infernode-linux-amd64
        path: |
          emu/Linux/o.emu
          Linux/amd64/bin/limbo
          Linux/amd64/bin/mk
          dis/
        retention-days: 14

  # ─────────────────────────────────────────────
  # Linux AMD64: the host tests no other job runs
  # ─────────────────────────────────────────────
  linux-amd64-host:
    name: Linux AMD64 Host Tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # two halves of about 18 minutes each, the whole being too long
        # for one job beside the build
        include:
          - shard: 1
            tests: >-
              activity_switch_test amd64_jit_typecom_bound_test
              amd64_jit_typecom_slab_test commands_test dhcp_client_test
              dis_parser_bounds_test editor_capability_test
              exec_fork_no_panic_test exec_timeout_kill_test
              factotum_keyfile_test gpsfs_test llmctl_test llmsrv_flush_test
              mail9p_imap_test network_capability_test pathmanage_test
              plumbrules_test secstore_legacy_auth_test spawn_budget_test
              statcheck_bounds_test tools9p_env_isolation_test
              tools9p_integration_test
          - shard: 2
            tests: >-
              amd64_jit_code_leak_test awk_builtins_test calendar9p_test
              cpu_boundary_test dialogue_test emu_root_test
              emulator_leader_lifecycle_test exec_confinement_test
              font_regression_test ipchecksum_test iproute_test
              jit_interp_handoff_test jit_real_test jsfs_test
              listen_rate_fairness_test mail9p_test
              modifier_mouse_emulation_test mount_clone_walk_test
              nsaudit_metadata_test profile_legacykey_test
              refadt_zero_test sdl3_keyboard_test secstore_apikey_test
              secstore_e2e_test secstore_logon_test secstored_test
              security_check_test serve_llm_smoke_test stale_dis_test
              strcat_test task_provisioning_test tcpseq_test themefs_test
              tls_malformed_server_test tools9p_activity_ns_test
              tools9p_basics_test tools9p_write_exec_view_test
              write_capability_test xenith_build_test
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libfido2-dev libudev-dev

    - name: Bootstrap build (mk, libraries, limbo, emulator)
      run: |
        chmod +x build-linux-amd64.sh
        ./build-linux-amd64.sh headless

    - name: Build runtime tree
      run: |
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        ./tools/verify-dis-build.sh

    - name: Compile test suite
      run: |
        LIMBO="$ROOT/Linux/amd64/bin/limbo"

        # Build the testing module first
        mkdir -p dis/tests dis/lib

        # Build testing library
        COMPILE_FAILURES=0
        if [ -d tests/testing ]; then
          cd tests/testing
          for f in *.b; do
            if [ -f "$f" ]; then
              if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/dis/lib/${f%.b}.dis" "$f" 2>&1; then
                echo "ERROR: Failed to compile testing/$f"
                COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
              fi
            fi
          done
          cd "$ROOT"
        fi

        # Build test runner and test files into tests/ where the runner expects them
        cd tests
        for f in *.b; do
          name="${f%.b}"
          echo "Compiling $f..."
          if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/tests/$name.dis" "$f" 2>&1; then
            echo "ERROR: Failed to compile $f"
            COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
          fi
        done
        cd "$ROOT"

        # Verify runner was compiled
        test -f tests/runner.dis || { echo "Test runner not compiled"; exit 1; }

        echo "Compiled test .dis files:"
        ls tests/*_test.dis 2>/dev/null | wc -l

        if [ "$COMPILE_FAILURES" -gt 0 ]; then
          echo "ERROR: $COMPILE_FAILURES test file(s) failed to compile"
          exit 1
        fi

    - name: Run host tests
      run: |
        # tests/host scripts that no other step runs, found by running
        # every one: the JIT's leaks, exec and namespace confinement,
        # secstore and factotum, tools9p, the 9P services (mail9p,
        # calendar9p, jsfs), the serve-llm daemon, and
        # source checks.  Those with a display are in the GUI job; those
        # needing a live service, a key or hardware are in none (vid9p's,
        # needing ffmpeg and tools/vdec, are with the GUI job's video
        # tests).  Each must pass: a skip here (exit 77) is a test that
        # stopped running, and fails too.
        mkdir -p tmp
        failed=
        for t in ${{ matrix.tests }}; do
          echo "::group::$t"
          rc=0
          ROOT=. bash tests/host/$t.sh < /dev/null || rc=$?
          echo "::endgroup::"
          [ $rc = 0 ] || { echo "::error::$t exited $rc"; failed="$failed $t"; }
        done
        [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

  # ─────────────────────────────────────────────
  # Linux AMD64 GUI: SDL3 build from source
  # ─────────────────────────────────────────────
  linux-amd64-gui:
    name: Linux AMD64 SDL3 GUI Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Stamp build version
      run: |
        BUILD_DATE=$(date +%Y%m%d)
        SHORT_SHA=${GITHUB_SHA::8}
        sed -i "s|InferNode 0.1|InferNode 0.1 build ${BUILD_DATE}-${SHORT_SHA}|" include/version.h
        echo "Version: $(cat include/version.h)"

    - name: Install build dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libgles-dev \
          libxtst-dev libdrm-dev libgbm-dev \
          libfido2-dev libudev-dev \
          patchelf

    - name: Build SDL3 from source
      run: |
        chmod +x install-sdl3.sh
        ./install-sdl3.sh

    - name: Build (SDL3 GUI)
      run: |
        chmod +x build-linux-amd64.sh
        ./build-linux-amd64.sh

    - name: Verify build
      run: |
        test -x emu/Linux/o.emu || { echo "Emulator not built"; exit 1; }
        test -x Linux/amd64/bin/limbo || { echo "Limbo compiler not built"; exit 1; }

    - name: Verify SDL3 linkage
      run: |
        ldd emu/Linux/o.emu | grep libSDL3 || { echo "Emulator not linked against SDL3"; exit 1; }

    - name: Verify libfido2 linkage (/dev/2fa)
      run: |
        # libfido2-dev was installed above, so the GUI emu must link libfido2 —
        # otherwise the #F (2fa) device degraded to its stub and YubiKey enroll
        # would dead-end with "insert your security key first". This guard is the
        # Linux analogue of the macOS HAVE_FIDO2 CI check (INFR-358).
        ldd emu/Linux/o.emu | grep -i libfido2 || { echo "Emulator not linked against libfido2 — /dev/2fa would be a stub"; exit 1; }

    - name: Build runtime tree
      run: |
        # the full Dis tree, as the headless jobs build it: the suite
        # loads /dis/mpeg, /dis/matrix, /dis/xenith/render and the rest
        export PATH="$ROOT/Linux/amd64/bin:$PATH"
        ./tools/verify-dis-build.sh

    - name: Compile test suite
      run: |
        LIMBO="$ROOT/Linux/amd64/bin/limbo"

        # Build the testing module first
        mkdir -p dis/tests dis/lib

        # Build testing library
        COMPILE_FAILURES=0
        if [ -d tests/testing ]; then
          cd tests/testing
          for f in *.b; do
            if [ -f "$f" ]; then
              if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/dis/lib/${f%.b}.dis" "$f" 2>&1; then
                echo "ERROR: Failed to compile testing/$f"
                COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
              fi
            fi
          done
          cd "$ROOT"
        fi

        # Build test runner and test files into tests/ where the runner expects them
        cd tests
        for f in *.b; do
          name="${f%.b}"
          echo "Compiling $f..."
          if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/tests/$name.dis" "$f" 2>&1; then
            echo "ERROR: Failed to compile $f"
            COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
          fi
        done
        cd "$ROOT"

        # Verify runner was compiled
        test -f tests/runner.dis || { echo "Test runner not compiled"; exit 1; }

        echo "Compiled test .dis files:"
        ls tests/*_test.dis 2>/dev/null | wc -l

        if [ "$COMPILE_FAILURES" -gt 0 ]; then
          echo "ERROR: $COMPILE_FAILURES test file(s) failed to compile"
          exit 1
        fi

    - name: Run test suite
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        # Create /tmp inside Inferno root for tmp_writable test
        mkdir -p tmp

        echo "Running test suite inside Inferno emulator..."
        # Deterministic completion: emu never exits cleanly (kernel threads
        # keep it alive) and the suite legitimately runs for minutes
        # (crypto_test alone is ~170s), so a fixed `timeout` truncates it.
        # Run emu in the background and wait for the runner's own "Total:"
        # summary line, then stop it. The backstop (<< the job's
        # timeout-minutes) only bounds a genuine hang. No `timeout` (absent
        # on macOS) so the same shape works everywhere.
        ./emu/Linux/o.emu -c1 -r . /tests/runner.dis -v > test-output.txt 2>&1 &
        EMU_PID=$!
        START=$SECONDS
        while kill -0 $EMU_PID 2>/dev/null; do
          grep -q "^Total:" test-output.txt 2>/dev/null && break
          [ $((SECONDS-START)) -ge 1500 ] && { echo "Backstop hit (1500s) with no Total: line — possible hang."; break; }
          sleep 2
        done
        kill -9 $EMU_PID 2>/dev/null || true
        wait $EMU_PID 2>/dev/null || true

        cat test-output.txt

        # Gating: the suite must finish (the runner's Total: line) and
        # fail nothing.  The runner gives each test its own namespace and
        # a time limit, so one test can neither break the next nor hold
        # the suite; a test whose environment is absent here skips.
        if ! grep -q "^Total:" test-output.txt; then
          echo "::error::The suite did not finish within the backstop. Last test started:"
          grep "^=== RUN" test-output.txt | tail -1 || true
          exit 1
        fi
        grep "^Total:" test-output.txt | tail -1
        if grep -q "^--- FAIL:" test-output.txt; then
          echo "::error::Failing tests:"
          grep "^--- FAIL:" test-output.txt
          exit 1
        fi

    - name: Run wallet and secstore integration tests
      run: |
        echo "Running host-side integration tests..."

        # wallet9p policy surface (offline, deterministic — a failure here
        # means the wallet's budget/approval/signing policy regressed, so
        # it fails the build; exit 77 = no emu available, skip)
        if [ -f tests/host/wallet9p_test.sh ]; then
          echo "--- wallet9p test ---"
          chmod +x tests/host/wallet9p_test.sh
          set +e
          ROOT=. bash tests/host/wallet9p_test.sh > wallet9p-test.txt 2>&1
          rc=$?
          set -e
          cat wallet9p-test.txt
          if [ $rc -eq 0 ]; then
            echo "wallet9p test: PASS"
          elif [ $rc -eq 77 ]; then
            echo "wallet9p test: SKIP (emu not built)"
          else
            echo "wallet9p test: FAIL"
            exit 1
          fi
        fi

        # wallet persistence (secstore round-trip)
        if [ -f tests/host/wallet_persist_test.sh ]; then
          echo "--- wallet persistence test ---"
          chmod +x tests/host/wallet_persist_test.sh
          ROOT=. bash tests/host/wallet_persist_test.sh > wallet-persist-test.txt 2>&1 || true
          cat wallet-persist-test.txt
          if grep -q "^PASS$" wallet-persist-test.txt; then
            echo "wallet persistence test: PASS"
          else
            echo "wallet persistence test: FAIL (non-fatal in CI)"
          fi
        fi

        # audit checkpoint signing (factotum-held key, ML-DSA-87)
        if [ -f tests/host/audit_signing_test.sh ]; then
          echo "--- audit signing test ---"
          chmod +x tests/host/audit_signing_test.sh
          ROOT=. bash tests/host/audit_signing_test.sh > audit-signing-test.txt 2>&1 || true
          cat audit-signing-test.txt
          if grep -q "=== PASS ===" audit-signing-test.txt; then
            echo "audit signing test: PASS"
          else
            echo "audit signing test: SKIP (requires full Inferno namespace)"
          fi
        fi

        # secstored failed-attempt lockout (AC-7 / FIA_AFL.1)
        if [ -f tests/host/secstore_lockout_test.sh ]; then
          echo "--- secstore lockout test ---"
          chmod +x tests/host/secstore_lockout_test.sh
          ROOT=. bash tests/host/secstore_lockout_test.sh > secstore-lockout-test.txt 2>&1 || true
          cat secstore-lockout-test.txt
          if grep -q "=== PASS ===" secstore-lockout-test.txt; then
            echo "secstore lockout test: PASS"
          else
            echo "secstore lockout test: SKIP (requires full Inferno namespace)"
          fi
        fi

    - name: Run JIT correctness tests
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        echo "Running JIT correctness tests (-c1)..."
        timeout 120 ./emu/Linux/o.emu -c1 -r . /dis/jittest.dis > jit-test.txt 2>&1 < /dev/null || true
        cat jit-test.txt
        if grep -q "^PASS$" jit-test.txt; then
          echo "JIT correctness tests: PASS"
        else
          echo "JIT correctness tests: FAIL"
          exit 1
        fi

    - name: Run JIT boot smoke test
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        chmod +x tests/host/jit_boot_test.sh
        SDL_VIDEODRIVER=dummy tests/host/jit_boot_test.sh

    - name: Run wm/wm tests
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        # wm/wm driven by the pointer: New, the sweep and its cursor,
        # the frame, focus, the menu's operations, a theme switch, a
        # client leaving, wm/shell typed at (the shell New starts),
        # wm/page, wm/sam edited through its windows, and every program
        # in dis/wm opening at a size that shows it, under wm/wm and in
        # Lucifer's zone.  wm_test.sh was written to
        # keep New from breaking again, and nothing ran it.
        for t in wm_test wm_cursor_test wm_size_test wm_theme_test wm_ghost_test wm_shell_test wm_editor_keys_test wm_edit_test wm_dir_test ftree_test page_test sam_gui_test lucifer_app_test lucictx_event_test; do
          echo "--- $t ---"
          ROOT=. sh tests/host/$t.sh
        done

    - name: Run Xenith and display host tests
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        # Host tests that need the SDL emulator, which no step ran:
        # Xenith's 9P files (tests/host/xenith_inside.sh), its races,
        # rescue, documents and browsing, the SDL renderer, /dev/wmsize,
        # Charon's engine and its origin filter (uitest_transport_test,
        # which needs vdec too, is with the video tests below).  Each must
        # pass: a skip here (exit 77) is a test that stopped running, and
        # fails too.
        failed=
        for t in sdl3_rendering_test wmsize_test \
            charon_headless_test charon_accept_test originfs_test \
            xenith_acme_files_test xenith_blankname_test xenith_edit_test \
            xenith_event_test xenith_image_test xenith_browse_test \
            xenith_scroll_focus_test xenith_scroll_quit_test \
            xenith_zerox_typing_test xenith_rescue_test xenith_agent_test \
            xenith_race_test xenith_doc_test; do
          echo "::group::$t"
          rc=0
          ROOT=. bash tests/host/$t.sh < /dev/null || rc=$?
          echo "::endgroup::"
          [ $rc = 0 ] || { echo "::error::$t exited $rc"; failed="$failed $t"; }
        done
        [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

    - name: Build tools/vdec (vid9p's decoder)
      run: |
        # FFmpeg 6.1, as the crate is pinned to.  ffmpeg-next's default
        # features link libavdevice, libavfilter and libswresample too;
        # libavdevice-dev brings the other two.
        sudo apt-get install -y clang ffmpeg libavcodec-dev libavformat-dev \
          libavutil-dev libswscale-dev libavdevice-dev
        # no --locked: Cargo.lock is ignored (tools/vdec/.gitignore);
        # Cargo.toml pins ffmpeg-next to 6.1
        (cd tools/vdec && cargo build --release)

    - name: Run video tests
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        # vid9p serving frames vdec decoded, its transport (play, pause,
        # seek) paced by the clock, and the Matrix video pane driving it
        # through /dev/pointer and /dev/keyboard.  A skip fails, as above.
        failed=
        for t in vid9p_test vid9p_transport_test uitest_transport_test; do
          echo "::group::$t"
          rc=0
          ROOT=. bash tests/host/$t.sh < /dev/null || rc=$?
          echo "::endgroup::"
          [ $rc = 0 ] || { echo "::error::$t exited $rc"; failed="$failed $t"; }
        done
        [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

    - name: Upload Linux GUI build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: infernode-linux-amd64-gui
        path: |
          emu/Linux/o.emu
          Linux/amd64/bin/limbo
          Linux/amd64/bin/mk
        retention-days: 14

  # ─────────────────────────────────────────────
  # Linux ARM64: Full bootstrap build from source
  # ─────────────────────────────────────────────
  linux-arm64:
    name: Linux ARM64 Build & Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      ROOT: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Stamp build version
      run: |
        BUILD_DATE=$(date +%Y%m%d)
        SHORT_SHA=${GITHUB_SHA::8}
        sed -i "s|InferNode 0.1|InferNode 0.1 build ${BUILD_DATE}-${SHORT_SHA}|" include/version.h
        echo "Version: $(cat include/version.h)"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libfido2-dev libudev-dev

    - name: Bootstrap build (mk, libraries, limbo, emulator)
      run: |
        chmod +x build-linux-arm64.sh
        ./build-linux-arm64.sh headless

    - name: Verify emulator binary
      run: |
        test -x emu/Linux/o.emu || { echo "Emulator not built"; exit 1; }
        file emu/Linux/o.emu
        test -x Linux/arm64/bin/limbo || { echo "Limbo compiler not built"; exit 1; }

    - name: Verify libfido2 linkage (/dev/2fa)
      run: |
        # libfido2-dev is installed, so the headless emu must link libfido2 or
        # the #F device would ship as a stub. Same guard as the GUI jobs.
        ldd emu/Linux/o.emu | grep -i libfido2 || { echo "Emulator not linked against libfido2 — /dev/2fa would be a stub"; exit 1; }

    - name: Build runtime tree
      run: |
        # the full Dis tree, as the amd64 and macOS jobs build it: the
        # host-side JIT tests below run /dis/sh.dis and /dis/tests
        export PATH="$ROOT/Linux/arm64/bin:$PATH"
        ./tools/verify-dis-build.sh

    - name: Compile test suite
      run: |
        LIMBO="$ROOT/Linux/arm64/bin/limbo"

        # Build the testing module first
        mkdir -p dis/tests dis/lib

        # Build testing library
        COMPILE_FAILURES=0
        if [ -d tests/testing ]; then
          cd tests/testing
          for f in *.b; do
            if [ -f "$f" ]; then
              if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/dis/lib/${f%.b}.dis" "$f" 2>&1; then
                echo "ERROR: Failed to compile testing/$f"
                COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
              fi
            fi
          done
          cd "$ROOT"
        fi

        # Build test runner and test files into tests/ where the runner expects them
        cd tests
        for f in *.b; do
          name="${f%.b}"
          echo "Compiling $f..."
          if ! "$LIMBO" -I "$ROOT/module" -o "$ROOT/tests/$name.dis" "$f" 2>&1; then
            echo "ERROR: Failed to compile $f"
            COMPILE_FAILURES=$((COMPILE_FAILURES + 1))
          fi
        done
        cd "$ROOT"

        # Verify runner was compiled
        test -f tests/runner.dis || { echo "Test runner not compiled"; exit 1; }

        echo "Compiled test .dis files:"
        ls tests/*_test.dis 2>/dev/null | wc -l

        if [ "$COMPILE_FAILURES" -gt 0 ]; then
          echo "ERROR: $COMPILE_FAILURES test file(s) failed to compile"
          exit 1
        fi

    - name: Run test suite
      run: |
        # Create /tmp inside Inferno root for tmp_writable test
        mkdir -p tmp

        echo "Running test suite inside Inferno emulator..."
        # Deterministic completion: emu never exits cleanly (kernel threads
        # keep it alive) and the suite legitimately runs for minutes
        # (crypto_test alone is ~170s), so a fixed `timeout` truncates it.
        # Run emu in the background and wait for the runner's own "Total:"
        # summary line, then stop it. The backstop (<< the job's
        # timeout-minutes) only bounds a genuine hang. No `timeout` (absent
        # on macOS) so the same shape works everywhere.
        ./emu/Linux/o.emu -c1 -r . /tests/runner.dis -v > test-output.txt 2>&1 &
        EMU_PID=$!
        START=$SECONDS
        while kill -0 $EMU_PID 2>/dev/null; do
          grep -q "^Total:" test-output.txt 2>/dev/null && break
          [ $((SECONDS-START)) -ge 1500 ] && { echo "Backstop hit (1500s) with no Total: line — possible hang."; break; }
          sleep 2
        done
        kill -9 $EMU_PID 2>/dev/null || true
        wait $EMU_PID 2>/dev/null || true

        cat test-output.txt

        # Gating: the suite must finish (the runner's Total: line) and
        # fail nothing.  The runner gives each test its own namespace and
        # a time limit, so one test can neither break the next nor hold
        # the suite; a test whose environment is absent here skips.
        if ! grep -q "^Total:" test-output.txt; then
          echo "::error::The suite did not finish within the backstop. Last test started:"
          grep "^=== RUN" test-output.txt | tail -1 || true
          exit 1
        fi
        grep "^Total:" test-output.txt | tail -1
        if grep -q "^--- FAIL:" test-output.txt; then
          echo "::error::Failing tests:"
          grep "^--- FAIL:" test-output.txt
          exit 1
        fi

    - name: Run JIT fault and bounds tests (JIT and interpreter)
      run: |
        # Gating, unlike the suite above: faults raised from compiled
        # code must be the interpreter's exceptions, caught by the
        # handler around them. The arm64 JIT failed both while the
        # suite's non-gating run hid it.
        ROOT=. sh tests/host/jit_fault_test.sh
        ROOT=. sh tests/host/jit_bounds_test.sh
        ROOT=. sh tests/host/utf21_test.sh

    - name: Run ML-DSA decompose test
      run: |
        # Decompose sees values derived from the signing key, so it must
        # not divide (a hardware divide's time depends on its operands;
        # cf. CVE-2026-22705). Whether a compiler emits one is per
        # architecture, hence on every runner. Host C, no emulator.
        ROOT=. bash tests/host/mldsa_decompose_test.sh

    - name: Run wallet and secstore integration tests
      run: |
        echo "Running host-side integration tests..."

        # wallet9p policy surface (offline, deterministic — a failure here
        # means the wallet's budget/approval/signing policy regressed, so
        # it fails the build; exit 77 = no emu available, skip)
        if [ -f tests/host/wallet9p_test.sh ]; then
          echo "--- wallet9p test ---"
          chmod +x tests/host/wallet9p_test.sh
          set +e
          ROOT=. bash tests/host/wallet9p_test.sh > wallet9p-test.txt 2>&1
          rc=$?
          set -e
          cat wallet9p-test.txt
          if [ $rc -eq 0 ]; then
            echo "wallet9p test: PASS"
          elif [ $rc -eq 77 ]; then
            echo "wallet9p test: SKIP (emu not built)"
          else
            echo "wallet9p test: FAIL"
            exit 1
          fi
        fi

        # wallet persistence (secstore round-trip)
        if [ -f tests/host/wallet_persist_test.sh ]; then
          echo "--- wallet persistence test ---"
          chmod +x tests/host/wallet_persist_test.sh
          ROOT=. bash tests/host/wallet_persist_test.sh > wallet-persist-test.txt 2>&1 || true
          cat wallet-persist-test.txt
          if grep -q "^PASS$" wallet-persist-test.txt; then
            echo "wallet persistence test: PASS"
          else
            echo "wallet persistence test: FAIL (non-fatal in CI)"
          fi
        fi

    - name: Upload Linux ARM64 build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: infernode-linux-arm64
        path: |
          emu/Linux/o.emu
          Linux/arm64/bin/limbo
          Linux/arm64/bin/mk
        retention-days: 14

