name: OSSF Scorecard

on:
  push:
    branches: [ master ]
  schedule:
    # Weekly on Mondays at 2am UTC
    - cron: '0 2 * * 1'

permissions: {}

jobs:
  scorecard:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        # Publish results to the repository's Security tab
        publish_results: true
        # Fine-grained PAT with admin:read to check branch protection
        repo_token: ${{ secrets.SCORECARD_TOKEN }}

    - name: Upload Scorecard SARIF
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
      with:
        sarif_file: scorecard-results.sarif

    - name: Upload Scorecard results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: scorecard-results
        path: scorecard-results.sarif
        retention-days: 30
