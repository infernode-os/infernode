name: style-gate

# Advisory foreign-paradigm checks (docs/DESIGN-PRINCIPLES.md): POSIX-isms in
# Inferno-side shell scripts, JSON module use inside appl/ outside the
# boundary allowlist. Findings surface as PR warnings; the job never fails
# until STYLE_GATE_STRICT is flipped in tools/style-gate.sh's environment.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  style-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run advisory style gate
        run: sh tools/style-gate.sh
