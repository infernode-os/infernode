# Incoming messages (mail, SMS) reaching the agent on their own.
#
# watch=on starts msgwatch at boot: each new message is triaged by
# /lib/veltro/policies/secretary.txt and, if it needs attention, given to
# activity 0 as a turn, which may delegate a task to draft a reply.  Drafts
# wait in /mnt/msg/pending for the user; nothing is ever sent by itself.
#
# Shipped off.  To turn it on, put watch=on in ~/.infernode/lib/veltro/messaging.conf.
watch=off
