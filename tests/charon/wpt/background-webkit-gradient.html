<!doctype html><title>-webkit-linear-gradient: a side is where it starts, 0deg points right</title>
<style>
body{margin:0}
.c{width:100px;height:50px;overflow:hidden}
/* each 200px wide, the left half shown: green, if the gradient runs left to right */
.g{width:200px;height:50px}
.a{background:-webkit-linear-gradient(left,green 100px,red 100px)}
.b{background:-webkit-linear-gradient(0deg,green 100px,red 100px)}
</style>
<div class=c><div class="g a"></div></div>
<div class=c><div class="g b"></div></div>
