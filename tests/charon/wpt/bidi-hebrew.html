<!doctype html><title>Hebrew in a left-to-right paragraph runs right to left</title>
<style>body{margin:0} .c{position:relative;width:300px;height:100px;font-size:0} .r{position:absolute;left:109px;top:0;width:100px;height:100px;background:red;z-index:-1}
.i{display:inline-block;width:100px;height:100px} .a{background:green}</style>
<!-- two inline-blocks between Hebrew letters are part of the right-to-left run: the first one ends up on the right -->
<div class=c><div class=r></div><div dir=ltr><span style="font-size:1px">א</span><span class="i a"></span><span class=i></span><span style="font-size:1px">ב</span></div></div>
