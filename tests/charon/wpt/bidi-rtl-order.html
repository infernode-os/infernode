<!doctype html><title>a right-to-left paragraph lays its content out from the right</title>
<style>body{margin:0} .c{position:relative;width:200px;height:100px;font-size:0} .r{position:absolute;left:100px;top:0;width:100px;height:100px;background:red;z-index:-1}
.p{direction:rtl} .i{display:inline-block;width:100px;height:100px} .a{background:green}</style>
<div class=c><div class=r></div><div class=p><span class="i a"></span><span class=i></span></div></div>
