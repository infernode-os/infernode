<!doctype html><title>center centres a block child with a width</title>
<style>body{margin:0;width:300px} .r{position:absolute;left:100px;top:0;width:100px;height:100px;background:red;z-index:-1} table{border-spacing:0} td{padding:0}</style>
<div class=r></div>
<center><table width=100><tr><td style="width:100px;height:100px;background:green"></td></tr></table></center>
