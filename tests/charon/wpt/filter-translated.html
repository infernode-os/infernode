<!doctype html><title>a filtered box moved by a translation is drawn where it is moved to</title>
<style>body{margin:0} .r{position:relative;width:100px;height:100px;background:red}
.g{position:absolute;left:300px;top:0;width:100px;height:100px;background:green;transform:translateX(-300px);filter:brightness(1)}</style>
<div class=r><div class=g></div></div>
