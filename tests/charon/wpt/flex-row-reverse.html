<!doctype html><title>flex row-reverse puts the first item at the end</title>
<style>body{margin:0} .u{position:relative;width:200px;height:100px} .r{position:absolute;left:100px;top:0;width:100px;height:100px;background:red}
.f{position:absolute;left:0;top:0;display:flex;flex-direction:row-reverse;width:200px} .f div{width:100px;height:100px} .a{background:green}</style>
<div class=u><div class=r></div><div class=f><div class=a></div><div></div></div></div>
