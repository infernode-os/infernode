<!doctype html><title>grid two columns</title>
<style>body{margin:0} .r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1}
.g{display:grid;grid-template-columns:50px 50px;width:100px} .g div{width:50px;height:50px;background:green}</style>
<div class=r></div><div class=g><div></div><div></div><div></div><div></div></div>
