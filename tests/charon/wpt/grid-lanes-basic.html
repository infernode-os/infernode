<!doctype html><title>grid lanes: items go to the shortest lane in turn, so four 50px squares in two 50px lanes fill a 100px square</title>
<style>body{margin:0} .r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1} .c{display:grid-lanes;grid-template-columns:50px 50px;width:100px} .c div{height:50px;background:green}</style>
<div class=r></div>
<div class=c><div></div><div></div><div></div><div></div></div>
