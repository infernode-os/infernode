<!doctype html><title>repeat(auto-fill, minmax())</title>
<style>body{margin:0} .r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1}
.g{display:grid;grid-template-columns:repeat(auto-fill, minmax(30px, 1fr));width:100px} .g div{height:50px;background:green}</style>
<div class=r></div><div class=g><div></div><div></div><div></div><div></div><div></div><div></div></div>
