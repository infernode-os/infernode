<!doctype html><title>grid spans and line numbers</title>
<style>body{margin:0} .r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1}
.g{display:grid;grid-template-columns:repeat(4, 25px);grid-auto-rows:50px;width:100px} .g div{background:green}
.w{grid-column:1 / -1} .s{grid-column:span 3}</style>
<div class=r></div><div class=g><div class=w></div><div class=s></div><div></div></div>
