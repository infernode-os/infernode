<style>body{margin:0} .c{position:relative;width:100px;height:50px} .r{position:absolute;left:0;top:0;width:250px;height:50px;background:red}
.i{position:absolute;left:0;top:0;display:inline-block;white-space:nowrap;font:50px/1 Ahem;color:transparent;background:green}</style>
<div class=c><div class=r></div><span class=i>aa aa</span></div>
