<html>
<!-- no doctype: quirks mode.  Four lines ended by <br>, 25px each, are
     a 100px green box over the red one; lines with only a <br> taken for
     lines with nothing on them (the line height quirk) left it short -->
<body style="margin:0">
<div style="position:absolute; left:0; top:0; width:100px; height:100px; background:red"></div>
<div style="position:absolute; left:0; top:0; width:100px; background:green; font:10px/25px sans-serif"><br><br><br><br></div>
</body>
</html>
