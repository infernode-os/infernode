<!doctype html><title>auto table layout: columns as wide as their content</title>
<style>body{margin:0} table{border-spacing:0} td{padding:0}
.r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1}</style>
<div class=r></div><table><tr><td><div style="width:60px;height:100px;background:green"></div></td><td><div style="width:40px;height:100px;background:green"></div></td></tr></table>
