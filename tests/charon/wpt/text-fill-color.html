<!doctype html><title>-webkit-text-fill-color fills the glyphs, whatever color is</title>
<style>
body{margin:0}
/* Ahem's glyphs are squares: four of 25px, four lines, a 100px square */
div{font:25px/25px Ahem;width:100px;color:red;-webkit-text-fill-color:green}
</style>
<div>XXXX XXXX XXXX XXXX</div>
