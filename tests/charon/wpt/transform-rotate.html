<!doctype html><title>transform: rotate(90deg) turns a box about its centre</title>
<style>body{margin:0} .r{position:absolute;left:0;top:0;width:100px;height:100px;background:red;z-index:-1} .g{position:absolute;left:-50px;top:50px;width:200px;height:100px;background:green;transform:rotate(90deg);transform-origin:50% 50%}
.w{position:absolute;left:100px;top:0;width:100px;height:200px;background:white}</style>
<div class=r></div><div class=g></div>
