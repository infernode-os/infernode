<!doctype html><title>a box translated and rotated is drawn where the transform takes it</title>
<style>body{margin:0} .r{position:relative;width:100px;height:100px;background:red}
.g{position:absolute;left:300px;top:0;width:100px;height:100px;background:green;transform:translateX(-300px) rotate(90deg)}</style>
<div class=r><div class=g></div></div>
