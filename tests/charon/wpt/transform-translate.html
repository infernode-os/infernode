<!doctype html><title>transform: translate() moves a box as drawn without moving its neighbours</title>
<style>body{margin:0} .r{position:absolute;left:100px;top:0;width:100px;height:100px;background:red;z-index:-1} .g{width:100px;height:100px;background:green;transform:translateX(100%)} .w{width:100px;height:100px;background:white}</style>
<div class=r></div>
<div class=g></div>
<div class=w></div>
