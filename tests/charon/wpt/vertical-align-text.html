<!doctype html><title>vertical-align moves an inline box's text with it</title>
<style>body{margin:0} .c{position:relative;width:100px;height:200px;font:100px/1 Ahem;color:green} .r{position:absolute;left:0;top:100px;width:100px;height:100px;background:red}
.c p{margin:0;position:absolute;left:0;top:0} span{vertical-align:-100px}</style>
<div class=c><div class=r></div><p><span>X</span></p></div>
