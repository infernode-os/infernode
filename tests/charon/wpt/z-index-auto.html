<!doctype html><title>z-index: auto is not a stacking context</title>
<style>body{margin:0} .p{position:relative;width:100px;height:100px} .p div{position:absolute;left:0;top:0;width:100px;height:100px;background:green;z-index:1}
.s{position:relative;z-index:0;margin-top:-100px;width:100px;height:100px;background:red}</style>
<div class=p><div></div></div><div class=s></div>
