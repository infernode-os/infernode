<form id="f" action="/search"><input name="q" value="hi"><input type="checkbox" name="c" checked><select name="s"><option>a</option><option value="B" selected>b</option></select><textarea name="t">text</textarea><button id="btn">go</button></form>

const results = [];
let fails = 0;
function check(name, got, want) {
	const ok = Object.is(got, want) || (typeof want === 'object' && JSON.stringify(got) === JSON.stringify(want));
	if (!ok) { fails++; console.log('FAIL ' + name + ': got ' + JSON.stringify(got) + ', want ' + JSON.stringify(want)); }
	results.push(ok);
}
function test(name, f) { console.log('group ' + name); try { f(); } catch (e) { fails++; results.push(false); console.log('FAIL ' + name + ': threw ' + e + (e && e.stack ? '\n' + e.stack : '')); } }

	check('head', document.head.localName, 'head');
	check('body', document.body.nodeName, 'BODY');
	check('title', document.title, 'dom');
	check('lang', document.documentElement.lang, 'en');
	check('readyState', document.readyState, 'loading');
	check('URL', document.URL.endsWith('/tests/js/pages/dom.html'), true);
	check('currentScript', document.currentScript.tagName, 'SCRIPT');
	check('window', window === globalThis && self === window && window.window === window, true);
	check('instanceof', document.body instanceof HTMLBodyElement && document.body instanceof HTMLElement && document.body instanceof Element && document.body instanceof Node && document.body instanceof EventTarget, true);
	check('doc instanceof', document instanceof Document && document instanceof HTMLDocument, true);
	check('identity', document.getElementById('main') === document.querySelector('#main'), true);
});

	check('nextSibling', main.firstChild.nextSibling.className, 'x y');
	check('parentNode', main.firstChild.parentNode === main, true);
	check('parentElement', document.documentElement.parentElement, null);
	check('ownerDocument', main.ownerDocument === document, true);
	check('contains', document.body.contains(main.firstChild), true);
	check('textContent', main.textContent, 'onetwothree');

test('mutation', () => {

	check('appended', document.getElementById('made') === d, true);
	check('lastElementChild', main.lastElementChild === d, true);
	const t = document.createTextNode('T');
	main.insertBefore(t, main.firstChild);
	check('insertBefore', main.firstChild === t, true);
	main.removeChild(t);
	check('removeChild', main.firstChild.nodeName, 'P');
	d.remove();
	check('remove', document.getElementById('made'), null);

	f.appendChild(document.createElement('b'));

	check('fragment emptied', f.childNodes.length, 0);
	main.lastElementChild.replaceWith('text');

	main.lastElementChild.remove();
	main.append('x', document.createElement('u'));

test('shadow DOM', () => {
	const st = document.createElement('style');
	st.textContent = '.sdp { color: rgb(255, 0, 0); }';
	document.head.appendChild(st);
	const host = document.createElement('div');
	host.innerHTML = '<div slot=t class=sdl>T</div><div class=sdu slot=nowhere>U</div>';
	document.body.appendChild(host);
	const sr = host.attachShadow({mode: 'open'});
	sr.innerHTML = '<style>.sdp { color: rgb(0, 0, 255); }</style><div class=sdp><slot name=t></slot></div>';
	const outside = document.createElement('p');
	outside.className = 'sdp';
	document.body.appendChild(outside);
	check('shadow rules inside', getComputedStyle(sr.querySelector('.sdp')).color, 'rgb(0, 0, 255)');
	check('document rules outside', getComputedStyle(outside).color, 'rgb(255, 0, 0)');
	check('slotted inherits from the slot', getComputedStyle(host.querySelector('.sdl')).color, 'rgb(0, 0, 255)');
	check('slotted laid out', host.querySelector('.sdl').getBoundingClientRect().width > 0, true);
	check('unslotted not', host.querySelector('.sdu').getBoundingClientRect().width, 0);
	check('a second root', (() => { try { host.attachShadow({mode: 'open'}); return 'no'; } catch (e) { return e.name; } })(), 'NotSupportedError');
	// events: up through the slot and the shadow root to the host, the
	// target retargeted outside
	const seen = [];
	const inner = sr.querySelector('.sdp');
	inner.addEventListener('click', (e) => seen.push('inner:' + (e.target === host.querySelector('.sdl'))));
	sr.addEventListener('click', (e) => seen.push('root'));
	host.addEventListener('click', (e) => seen.push('host:' + (e.target === host.querySelector('.sdl')) + ':' + e.eventPhase));
	document.body.addEventListener('click', (e) => seen.push('body:' + (e.target === host.querySelector('.sdl'))));
	host.querySelector('.sdl').dispatchEvent(new MouseEvent('click', {bubbles: true, composed: true}));
	check('slotted event path', seen.join(' '), 'inner:true root host:true:3 body:true');
	seen.length = 0;
	inner.dispatchEvent(new MouseEvent('click', {bubbles: true, composed: true}));
	check('shadow event retargeted', seen.join(' '), 'inner:false root host:false:2 body:false');
	const evs = [];
	document.body.addEventListener('xx', (e) => evs.push(e.target === host ? 'host' : 'other'));
	inner.dispatchEvent(new Event('xx', {bubbles: true, composed: true}));
	inner.dispatchEvent(new Event('xx', {bubbles: true}));
	check('composed crosses, not composed stays', evs.join(), 'host');
	host.remove();
	outside.remove();
	st.remove();
});

test('events', () => {
	const main = document.getElementById('main');
	const p = main.querySelector('p');
	const order = [];
	main.addEventListener('ping', (e) => order.push('capture main ' + e.eventPhase), true);
	main.addEventListener('ping', (e) => order.push('bubble main ' + e.eventPhase));
	p.addEventListener('ping', (e) => { order.push('target ' + e.eventPhase); });
	document.addEventListener('ping', (e) => order.push('doc'));
	window.addEventListener('ping', (e) => order.push('window'));
	p.dispatchEvent(new Event('ping', {bubbles: true}));
	check('order', order, ['capture main 1', 'target 2', 'bubble main 3', 'doc', 'window']);
	let n = 0;
	const h = () => n++;
	p.addEventListener('x', h, {once: true});
	p.dispatchEvent(new Event('x'));
	p.dispatchEvent(new Event('x'));
	check('once', n, 1);
	p.addEventListener('y', h);
	p.removeEventListener('y', h);
	p.dispatchEvent(new Event('y'));
	check('removed', n, 1);
	const ev = new CustomEvent('z', {detail: {k: 1}, cancelable: true});
	p.addEventListener('z', (e) => e.preventDefault());
	check('prevented', p.dispatchEvent(ev), false);
	check('detail', ev.detail.k, 1);
	check('defaultPrevented', ev.defaultPrevented, true);
	let stopped = true;
	p.addEventListener('s', (e) => e.stopPropagation());
	main.addEventListener('s', () => { stopped = false; });
	p.dispatchEvent(new Event('s', {bubbles: true}));
	check('stopPropagation', stopped, true);
	let target = null;
	main.onclick = (e) => { target = e.target; };
	p.click();
	check('onclick', target === p, true);
	main.onclick = null;
	document.getElementById('clickme').click();
	check('inline handler', window.clicked, 1);
	check('handler property', typeof document.getElementById('clickme').onclick, 'function');
	const ac = new AbortController();
	let m = 0;
	p.addEventListener('q', () => m++, {signal: ac.signal});
	ac.abort();
	p.dispatchEvent(new Event('q'));
	check('signal', m, 0);
});

		check('raf', window.raf, 'number');
		document.title = (fails ? 'FAIL ' + fails : 'PASS') + ' ' + results.length;
		console.log(document.title);
	}, 200);
});
</script>
