  <alias binding="strong"><family>trebuchet ms</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>open sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>inter</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>noto sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>ubuntu</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>cantarell</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>fira sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>liberation sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>arimo</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>nimbus sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>lato</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>source sans pro</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>pt sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>ibm plex sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>dejavu sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>bitstream vera sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>montserrat</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>cursive</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>fantasy</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <!-- the host's rules prefer another face for serif; this comes after them -->
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit></match>
</fontconfig>
