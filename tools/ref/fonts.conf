<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The reference Chromium's fonts: the faces Charon ships (DejaVu), so a
     comparison measures layout, not the choice of typeface.  Chromium maps
     the generic families to Arial, Times New Roman and Courier New, which
     the host would otherwise resolve to Liberation or URW's Nimbus faces. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont>
    <glob>*/Liberation*</glob><glob>*/Free*</glob><glob>*/Nimbus*</glob>
  </rejectfont></selectfont>
  <alias binding="strong"><family>Arial</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>Times</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>Courier New</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Courier</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
