<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The reference Chromium's fonts: the faces Charon draws each family
     in (appl/lib/web/fonts.b's family()), so a comparison measures
     layout, not the choice of typeface.  Liberation Sans and Termes stand
     in for Arial and Times (their advances), DejaVu for the rest; the
     tree's own files (fonts/texgyre, fonts/dejavu), found from here, and
     the host's Liberation, Free and Nimbus faces refused. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../fonts/dejavu</dir>
  <selectfont><rejectfont>
    <glob>*/Free*</glob><glob>*/Nimbus*</glob>
  </rejectfont></selectfont>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>ui-serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>times new roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>liberation serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>tinos</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>nimbus roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>georgia</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>garamond</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>cambria</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>palatino</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>palatino linotype</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>book antiqua</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>baskerville</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>noto serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>dejavu serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>source serif pro</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>merriweather</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>charter</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>iowan old style</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>courier</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>courier new</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
